<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F5F5F7" />
  <title>Mido waawi Pular! – Fuuta Jallon</title>
  <style>
    /* =========================================================================
       1. DESIGN TOKENS – CALM APPLE / iOS MINIMALISM (LIGHT DEFAULT + DARK)
       ========================================================================= */
    :root {
      --bg-outer: #EBEBEF;
      --bg-canvas: #F5F5F7;
      --bg-card: #FFFFFF;
      --bg-subtle: #F2F2F7;
      --bg-segment: #E5E5EA;
      --bg-nav: rgba(255, 255, 255, 0.84);
      --bg-header: rgba(245, 245, 247, 0.86);

      --border-hairline: rgba(0, 0, 0, 0.06);
      --border-control: rgba(0, 0, 0, 0.10);

      --text-primary: #111827;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;

      --accent: #0F766E;
      --accent-hover: #0D655E;
      --accent-soft: rgba(15, 118, 110, 0.09);
      --accent-soft-strong: rgba(15, 118, 110, 0.16);
      --accent-on: #FFFFFF;

      --danger: #DC2626;
      --danger-soft: rgba(220, 38, 38, 0.09);

      --amber-text: #B45309;
      --amber-soft: rgba(217, 119, 6, 0.10);

      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.03);
      --shadow-shell: 0 20px 50px rgba(0, 0, 0, 0.08);
      --shadow-seg: 0 1px 3px rgba(0, 0, 0, 0.09);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-pill: 999px;
      --nav-height: 64px;
    }

    html[data-theme="dark"] {
      --bg-outer: #000000;
      --bg-canvas: #000000;
      --bg-card: #1C1C1E;
      --bg-subtle: #2C2C2E;
      --bg-segment: #2C2C2E;
      --bg-nav: rgba(28, 28, 30, 0.84);
      --bg-header: rgba(0, 0, 0, 0.82);

      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-control: rgba(255, 255, 255, 0.14);

      --text-primary: #F9FAFB;
      --text-secondary: #9CA3AF;
      --text-tertiary: #6B7280;

      --accent: #2DD4BF;
      --accent-hover: #14B8A6;
      --accent-soft: rgba(45, 212, 191, 0.13);
      --accent-soft-strong: rgba(45, 212, 191, 0.22);
      --accent-on: #042F2E;

      --danger: #F87171;
      --danger-soft: rgba(248, 113, 113, 0.14);

      --amber-text: #FBBF24;
      --amber-soft: rgba(251, 191, 36, 0.13);

      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-shell: 0 20px 60px rgba(0, 0, 0, 0.65);
      --shadow-seg: 0 1px 3px rgba(0, 0, 0, 0.45);
    }

    /* =========================================================================
       2. RESET & BASE TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--bg-outer);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.48;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      transition: transform 0.12s ease, opacity 0.15s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      cursor: default;
    }

    /* =========================================================================
       3. APP SHELL (MOBILE-FIRST, CENTERED DESKTOP FRAME)
       ========================================================================= */
    .app-shell {
      position: relative;
      margin: 0 auto;
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 560px) {
      .app-shell {
        margin: 16px auto;
        min-height: calc(100vh - 32px);
        border-radius: 28px;
        border: 1px solid var(--border-hairline);
        box-shadow: var(--shadow-shell);
        overflow: hidden;
      }
    }

    /* Minimalistischer Header: nur Titel + Dark/Light-Button */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-header);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-hairline);
      padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-title {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.15;
      color: var(--text-primary);
    }

    .theme-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-pill);
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-card);
      flex-shrink: 0;
    }

    .theme-btn:hover {
      color: var(--text-primary);
    }

    /* Hauptbereich */
    .main-content {
      flex: 1;
      padding: 16px 20px calc(var(--nav-height) + 28px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .view-enter {
      animation: fadeSlide 0.18s ease-out;
    }

    /* 5-Tab Bottom-Navigation (Frosted Glass) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      z-index: 40;
      background: var(--bg-nav);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
      border-top: 1px solid var(--border-hairline);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
    }

    @media (min-width: 560px) {
      .bottom-nav {
        position: sticky;
        left: 0;
        transform: none;
      }
    }

    .nav-btn {
      min-height: 52px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 1.85;
    }

    .nav-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    .nav-btn.active svg {
      stroke-width: 2.2;
    }

    /* =========================================================================
       4. SHARED MINIMALIST COMPONENTS
       ========================================================================= */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 3px;
      background: var(--bg-segment);
      border-radius: 12px;
      gap: 3px;
    }

    .seg-btn {
      min-height: 38px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seg-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: var(--shadow-seg);
    }

    .btn-primary {
      width: 100%;
      min-height: 48px;
      padding: 0 20px;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: var(--accent-on);
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.45;
    }

    .btn-secondary {
      width: 100%;
      min-height: 48px;
      padding: 0 18px;
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .section-eyebrow {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      padding: 0 4px;
      margin-bottom: 8px;
    }

    /* Scrollbare Kategorie-Pills */
    .pills-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .pill {
      flex-shrink: 0;
      min-height: 36px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-on);
      font-weight: 600;
    }

    .empty-card {
      padding: 36px 20px;
      text-align: center;
    }

    .empty-card h3 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 600;
    }

    .empty-card p {
      margin: 0 0 16px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* =========================================================================
       5. TAB 1: SÄTZE (SURVIVAL PHRASEBOOK)
       ========================================================================= */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box svg.ico-search {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-tertiary);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 10px 40px 10px 42px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      box-shadow: var(--shadow-card);
      font-size: 16px; /* Verhindert iOS Auto-Zoom */
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .clear-x {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: var(--radius-pill);
      color: var(--text-tertiary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .filter-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .slim-seg {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-segment);
      padding: 3px;
      border-radius: 10px;
      gap: 2px;
    }

    .slim-seg button {
      min-height: 34px;
      padding: 0 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .slim-seg button.active {
      background: var(--bg-card);
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: var(--shadow-seg);
    }

    .quiet-progress {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Sanakuyaagal Info Bar */
    .info-collapse {
      overflow: hidden;
    }

    .info-collapse-btn {
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .info-collapse-body {
      display: none;
      padding: 0 16px 14px;
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.55;
      border-top: 1px solid var(--border-hairline);
    }

    .info-collapse.open .info-collapse-body {
      display: block;
      padding-top: 12px;
    }

    .chev {
      width: 18px;
      height: 18px;
      color: var(--text-tertiary);
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .open > button .chev {
      transform: rotate(180deg);
    }

    /* Ultra-Clean Phrase Cards */
    .phrase-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .phrase-card {
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .phrase-main {
      min-width: 0;
      flex: 1;
    }

    .phrase-pular {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text-primary);
      line-height: 1.3;
      word-break: break-word;
    }

    .phrase-de {
      font-size: 14.5px;
      color: var(--text-secondary);
      margin-top: 2px;
      line-height: 1.4;
    }

    .phrase-foot {
      margin-top: 7px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .tag-subtle {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--bg-subtle);
      color: var(--text-secondary);
    }

    .tag-subtle.tag-respect {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tag-subtle.tag-grenze {
      background: var(--amber-soft);
      color: var(--amber-text);
    }

    .tag-subtle.tag-hart {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .phrase-note {
      font-size: 12.5px;
      color: var(--text-tertiary);
      line-height: 1.35;
    }

    /* Kreisförmiger Check-Button */
    .circle-check {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-pill);
    }

    .circle-check-inner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.75px solid var(--border-control);
      background: transparent;
      color: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.16s ease;
    }

    .circle-check.done .circle-check-inner {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-on);
    }

    /* =========================================================================
       6. TAB 2: ÜBERSETZER (GOOGLE TRANSLATE STYLE)
       ========================================================================= */
    .lang-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 6px;
      gap: 6px;
    }

    .lang-label {
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      padding: 8px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .swap-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .swap-btn:hover {
      background: var(--accent-soft);
    }

    .swap-btn svg {
      transition: transform 0.25s ease;
    }

    .swap-btn.rotated svg {
      transform: rotate(180deg);
    }

    .trans-input-card {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .trans-textarea-wrap {
      position: relative;
    }

    .trans-textarea {
      width: 100%;
      min-height: 104px;
      padding: 4px 36px 4px 0;
      border: none;
      background: transparent;
      resize: none;
      outline: none;
      font-size: 18px;
      line-height: 1.45;
      color: var(--text-primary);
    }

    .trans-textarea::placeholder {
      color: var(--text-tertiary);
    }

    .trans-clear-btn {
      position: absolute;
      top: 0;
      right: -4px;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-pill);
      color: var(--text-tertiary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .trans-clear-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .example-chip {
      min-height: 34px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .example-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Output Card */
    .trans-output-card {
      padding: 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .trans-result-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.32;
      color: var(--accent);
      word-break: break-word;
    }

    .trans-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .copy-btn {
      min-height: 36px;
      padding: 0 12px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .copy-btn.copied {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .source-indicator {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
    }

    .trans-divider {
      height: 1px;
      background: var(--border-hairline);
      margin: 2px 0;
    }

    .trans-note-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .trans-politeness {
      display: inline-flex;
      align-self: flex-start;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 9px;
      border-radius: 6px;
    }

    .trans-note-text {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin: 0;
    }

    /* Loading Pulse */
    .skeleton-line {
      height: 22px;
      border-radius: 8px;
      background: var(--bg-subtle);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    /* Verlauf */
    .history-header-btn {
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .history-list {
      display: none;
      border-top: 1px solid var(--border-hairline);
    }

    .info-collapse.open .history-list {
      display: block;
    }

    .history-item {
      width: 100%;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-item:last-of-type {
      border-bottom: none;
    }

    .history-item:hover {
      background: var(--bg-subtle);
    }

    .history-src {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .history-tgt {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .history-footer {
      padding: 8px 16px 12px;
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid var(--border-hairline);
    }

    .text-btn-muted {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .text-btn-muted:hover {
      color: var(--danger);
      background: var(--danger-soft);
    }

    /* =========================================================================
       7. TAB 3: ÜBEN (KARTEIKARTEN & ALLTAGS-QUIZ)
       ========================================================================= */
    .compact-filter-bar {

      align-items: center;
      gap: 8px;
      flex-wrap: wrap;

      min-width: 140px;
      min-height: 40px;
      padding: 0 32px 0 12px;
      border-radius: 10px;

      border: 1px solid var(--border-hairline);
      box-shadow: var(--shadow-card);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      outline: none;
      appearance: none;
      -webkit-appearance: none;

      background-repeat: no-repeat;
      background-position: right 10px center;
    }

    .compact-chip {
      min-height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      box-shadow: var(--shadow-card);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .compact-chip.active {
      background: var(--accent-soft);
      border-color: transparent;
      color: var(--accent);
    }

    /* 3D Flip Card */
    .flip-stage {
      perspective: 1100px;
      width: 100%;
      user-select: none;
      touch-action: pan-y;
      cursor: pointer;
    }

    .flip-inner {
      position: relative;
      width: 100%;
      min-height: 272px;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .flip-inner.flipped {
      transform: rotateY(180deg);
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 22px;
      padding: 22px 22px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      box-shadow: var(--shadow-card);
    }

    .flip-back {
      transform: rotateY(180deg);
      border-color: var(--accent-soft-strong);
    }

    .flip-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
    }

    .flip-center {
      text-align: center;
      padding: 12px 4px;
    }

    .flip-text {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.28;
      color: var(--text-primary);
      word-break: break-word;
    }

    .flip-back .flip-text {
      color: var(--accent);
      font-size: 21px;
    }

    .flip-note {
      margin-top: 12px;
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .flip-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .two-col-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card-sub-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
      padding: 0 4px;
    }

    /* Quiz */
    .quiz-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .progress-slim {
      width: 100%;
      height: 4px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      overflow: hidden;
    }

    .progress-slim-fill {
      height: 100%;
      background: var(--accent);
      border-radius: var(--radius-pill);
      transition: width 0.28s ease;
    }

    .quiz-question {
      font-size: 17.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.4;
      color: var(--text-primary);
    }

    .quiz-opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-opt {
      width: 100%;
      min-height: 50px;
      padding: 13px 16px;
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      border: 1.5px solid transparent;
      text-align: left;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .quiz-opt:hover:not(:disabled) {
      border-color: var(--border-control);
    }

    .quiz-opt.correct {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .quiz-opt.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
      font-weight: 600;
    }

    .quiz-opt.dim {
      opacity: 0.42;
    }

    .quiz-explain {
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg-subtle);
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .quiz-explain strong {
      color: var(--text-primary);
    }

       8. TAB 4: BAUEN (SATZBAUER & BEFEHL / VERBOT)
       ========================================================================= */
    .preview-card {
      padding: 22px 20px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .preview-pular {
      font-size: 25px;
      font-weight: 700;

      font-weight: 500;
      color: var(--text-secondary);

    .preview-breakdown {

      color: var(--text-tertiary);
      line-height: 1.45;
    }

    .chip-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .chip-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .select-chip {
      min-height: 46px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--bg-card);

      justify-content: center;

      flex-direction: column;
      gap: 4px;

      gap: 10px;

    .gram-title {

      font-weight: 600;

      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);

      /* =======================================================================

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalizeText(str) {
        return String(str || '')
          .toLowerCase()
          .replace(/[?!.,„“"()…]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function shuffle(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = copy[i];
          copy[i] = copy[j];
          copy[j] = tmp;
        }
        return copy;
      }

      function isMastered(id) {
        return state.masteredIds.includes(id);
      }

      function setMastered(id, val) {
        const idx = state.masteredIds.indexOf(id);
        if (val && idx === -1) {
          state.masteredIds.push(id);
          saveState();
        } else if (!val && idx !== -1) {
          state.masteredIds.splice(idx, 1);
          saveState();
        }
      }

      function toggleMastered(id) {
        const next = !isMastered(id);
        setMastered(id, next);
        return next;
      }

      function copyToClipboard(text) {
        // Nutzt document.execCommand('copy') für zuverlässige iFrame-Kompatibilität
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (e) {
          return false;
        }
      }

      let toastTimer = null;
      function showToast(msg) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
      }

        document.documentElement.setAttribute('data-theme', state.theme);
        const moon = document.getElementById('ico-moon');

        if (moon && sun) {
          moon.style.display = state.theme === 'light' ? 'block' : 'none';
          sun.style.display = state.theme === 'dark' ? 'block' : 'none';
        }
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', state.theme === 'dark' ? '#000000' : '#F5F5F7');
      }

      /* =======================================================================
         7. HYBRID TRANSLATION ENGINE (LOCAL EXACT + GEMINI API + FALLBACK)
         ======================================================================= */
      function lookupLocalExact(input, dir) {
        const norm = normalizeText(input);
        if (!norm) return null;

        for (let i = 0; i < PHRASES.length; i++) {
          const p = PHRASES[i];
          const srcField = dir === 'de-pular' ? p.de : p.pular;
          const tgtField = dir === 'de-pular' ? p.pular : p.de;

          // Prüfe vollen Eintrag oder durch "/" getrennte Varianten
          const variants = srcField.split('/').map((s) => normalizeText(s.replace(/\(.*?\)/g, '')));
          const fullNorm = normalizeText(srcField.replace(/\(.*?\)/g, ''));

          if (norm === fullNorm || variants.includes(norm)) {
            return {
              translation: tgtField,
              literalOrNote: p.note || (dir === 'de-pular' ? `Fuuta-Jallon-Wendung für „${p.de}“` : `Entspricht im Deutschen „${p.de}“`),
              politeness: p.tag || 'Alltag',
              sourceLabel: 'Offline-Wörterbuch',
            };
          }
        }

        // Einzelwort-Exact-Match im Extra-Wörterbuch
        if (dir === 'de-pular') {
          for (let i = 0; i < EXTRA_DICT.length; i++) {
            if (normalizeText(EXTRA_DICT[i][0]) === norm) {
              return {
                translation: EXTRA_DICT[i][1],
                literalOrNote: 'Kernvokabel im Pular (Fuuta Jallon).',
                politeness: 'Alltag',
                sourceLabel: 'Offline-Wörterbuch',
              };
            }
          }
        } else {
          for (let i = 0; i < EXTRA_DICT.length; i++) {
            const pularOpts = EXTRA_DICT[i][1].split('/').map((s) => normalizeText(s));
            if (pularOpts.includes(norm)) {
              return {
                translation: EXTRA_DICT[i][0].charAt(0).toUpperCase() + EXTRA_DICT[i][0].slice(1),
                literalOrNote: 'Kernvokabel aus dem Pular (Fuuta Jallon).',
                politeness: 'Alltag',
                sourceLabel: 'Offline-Wörterbuch',
              };
            }
          }
        }

        return null;
      }

      function lookupLocalFallback(input, dir) {
        const norm = normalizeText(input);
        const tokens = norm.split(' ').filter((t) => t.length > 1);

        // 1. Beste Teil-Übereinstimmung in den 148 Phrasen suchen
        let bestPhrase = null;
        let bestScore = 0;

        for (let i = 0; i < PHRASES.length; i++) {
          const p = PHRASES[i];
          const hay = normalizeText(dir === 'de-pular' ? p.de : p.pular);
          if (hay.includes(norm) && norm.length >= 4) {
            const score = norm.length / Math.max(hay.length, 1) + 1;
            if (score > bestScore) {
              bestScore = score;
              bestPhrase = p;
            }
          } else if (tokens.length > 0) {
            let hits = 0;
            for (let t = 0; t < tokens.length; t++) {
              if (hay.includes(tokens[t])) hits++;
            }
            const ratio = hits / tokens.length;
            if (ratio >= 0.5 && hits > bestScore) {
              bestScore = hits;
              bestPhrase = p;
            }
          }
        }

        if (bestPhrase) {
          return {
            translation: dir === 'de-pular' ? bestPhrase.pular : bestPhrase.de,
            literalOrNote: `Nächster Offline-Treffer (${bestPhrase.pular} = ${bestPhrase.de}). Für exakte freie Sätze bitte online verbinden.`,
            politeness: bestPhrase.tag || 'Alltag',
            sourceLabel: 'Offline-Wörterbuch (ungefähr)',
          };
        }

        // 2. Wort-für-Wort-Annäherung aus dem Kernwörterbuch
        const mapped = [];
        let matchedCount = 0;
        const words = norm.split(' ').filter(Boolean);

        for (let w = 0; w < words.length; w++) {
          const word = words[w];
          let found = null;
          for (let j = 0; j < EXTRA_DICT.length; j++) {
            const deW = normalizeText(EXTRA_DICT[j][0]);
            const puW = EXTRA_DICT[j][1].split('/')[0].trim();
            if (dir === 'de-pular' && deW === word) {
              found = puW;
              break;
            }
            if (dir === 'pular-de' && normalizeText(EXTRA_DICT[j][1]).includes(word)) {
              found = EXTRA_DICT[j][0];
              break;
            }
          }
          if (found) {
            mapped.push(found);
            matchedCount++;
          } else {
            mapped.push(word);
          }
        }

        if (matchedCount > 0) {
          return {
            translation: mapped.join(' '),
            literalOrNote: 'Wort-für-Wort-Annäherung ohne Internetverbindung – Grammatik ggf. grob.',
            politeness: 'Ungefähr',
            sourceLabel: 'Offline-Wörterbuch (ungefähr)',
          };
        }

        return {
          translation: 'Keine Offline-Übereinstimmung',
          literalOrNote: 'Dieses Wort ist nicht im Offline-Wörterbuch und die KI-Verbindung ist gerade nicht erreichbar.',
          politeness: '',
          sourceLabel: 'Offline-Wörterbuch (ungefähr)',
        };
      }

      async function fetchGeminiTranslation(text, dir) {
        const apiKey = '';
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const systemPrompt = `Du bist ein erfahrener Übersetzer und Muttersprachler für Pular aus dem Fuuta Jallon (Guinea) und Deutsch.
Übersetze strikt im authentischen Dialekt Pular Fuuta Jallon (Guinea) nach dem Peace-Corps-Standard:
- Nutze Fuuta-Jallon-Formen: mido/hida/himo/meden/hiden/hidon/hibe, a jaraama / on jaraama, ko honto, ko hondun, wonaa, alaa, -ugol/-agol/-egol, -ii/-ay/-ude/-aali/-ataa, wata a.
- Nutze KEIN Senegal-Pulaar (kein "miɗo yaha" statt Fuuta-Formen, kein "naa" wo Fuuta "wonaa" bevorzugt, kein "mbadda" aus Ost-Fulfulde).
- Übersetze natürlich, alltagstauglich und prägnant (80/20-Stil). Auch derbe Sätze, Grenzen oder Beleidigungen sachlich und authentisch übersetzen.
- Antworte ausschließlich als JSON gemäß Schema:
  - translation: die fertige Übersetzung in der Zielsprache.
  - literalOrNote: maximal 1–2 sehr kurze, hilfreiche Sätze auf Deutsch (z. B. wörtliche Bedeutung, Aussprachetipp oder Kulturhinweis).
  - politeness: kurzes deutsches Label wie "Alltag", "Respekt", "Locker", "Grenze" oder "Hart".`;

        const userPrompt = dir === 'de-pular'
          ? `Übersetze ins Pular (Fuuta Jallon, Guinea): "${text}"`
          : `Übersetze aus dem Pular (Fuuta Jallon, Guinea) ins Deutsche: "${text}"`;

        const payload = {
          contents: [{ parts: [{ text: userPrompt }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: {
                translation: { type: 'STRING' },
                literalOrNote: { type: 'STRING' },
                politeness: { type: 'STRING' },
              },
              required: ['translation', 'literalOrNote', 'politeness'],
            },
          },
        };

        const delays = [1000, 2000, 4000];
        let lastErr = null;

        for (let attempt = 0; attempt <= delays.length; attempt++) {
          try {
            const res = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (res.status === 429 || res.status >= 500) {
              if (attempt < delays.length) {
                await new Promise((r) => setTimeout(r, delays[attempt]));
                continue;
              }
            }

            if (!res.ok) {
              throw new Error('HTTP ' + res.status);
            }

            const data = await res.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!rawText) throw new Error('Leere Antwort');

            const parsed = JSON.parse(rawText);
            if (!parsed.translation) throw new Error('Ungültiges JSON');

            return {
              translation: parsed.translation.trim(),
              literalOrNote: (parsed.literalOrNote || '').trim(),
              politeness: (parsed.politeness || 'Alltag').trim(),
              sourceLabel: 'KI · Fuuta Jallon',
            };
          } catch (err) {
            lastErr = err;
            if (attempt < delays.length) {
              await new Promise((r) => setTimeout(r, delays[attempt]));
            }
          }
        }
        throw lastErr || new Error('Übersetzung fehlgeschlagen');
      }

      function pushHistory(entry) {
        const filtered = state.history.filter(
          (h) => !(h.dir === entry.dir && normalizeText(h.src) === normalizeText(entry.src))
        );
        state.history = [entry, ...filtered].slice(0, 10);
        saveState();
      }

      async function runTranslate() {
        const text = ui.transInput.trim();
        if (!text || ui.transLoading) return;

        ui.transCopied = false;

        // 1. Sofortige lokale Exact-Suche
        const exact = lookupLocalExact(text, ui.transDir);
        if (exact) {
          ui.transResult = exact;
          ui.transLoading = false;
          pushHistory({ dir: ui.transDir, src: text, ...exact });
          renderUebersetzer(document.getElementById('main-content'));
          return;
        }

        // 2. Live-KI-Übersetzung via Gemini API (mit Fallback)
        ui.transLoading = true;
        ui.transResult = null;
        renderUebersetzer(document.getElementById('main-content'));

        try {
          const aiRes = await fetchGeminiTranslation(text, ui.transDir);
          ui.transResult = aiRes;
          pushHistory({ dir: ui.transDir, src: text, ...aiRes });
        } catch (e) {
          const fb = lookupLocalFallback(text, ui.transDir);
          ui.transResult = fb;
          if (fb.translation !== 'Keine Offline-Übereinstimmung') {
            pushHistory({ dir: ui.transDir, src: text, ...fb });
          }
        } finally {
          ui.transLoading = false;
          if (ui.tab === 'uebersetzer') {
            renderUebersetzer(document.getElementById('main-content'));
          }
        }
      }

      function getFilteredPhrases() {
        const q = ui.search.trim().toLowerCase();
        return PHRASES.filter((p) => {
          if (ui.phraseCat !== 'all' && p.cat !== ui.phraseCat) return false;
          if (ui.phraseFilter === 'open' && isMastered(p.id)) return false;
          if (q) {
            const hay = `${p.pular} ${p.de} ${p.note || ''} ${p.tag || ''}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      function tagClass(tag) {
        if (tag === 'Respekt') return 'tag-respect';
        if (tag === 'Grenze') return 'tag-grenze';
        if (tag === 'Beleidigung') return 'tag-hart';
        return '';
      }

              <div class="phrase-main">
                <div class="phrase-pular">${esc(p.pular)}</div>

        });

        ta?.addEventListener('keydown', (e) => {
          if ((e.key === 'Enter' && !e.shiftKey) || (e.key === 'Enter' && (e.metaKey || e.ctrlKey))) {
            e.preventDefault();
            runTranslate();
          }
        });

        document.getElementById('btn-do-translate')?.addEventListener('click', runTranslate);

        document.getElementById('btn-trans-clear')?.addEventListener('click', () => {
          ui.transInput = '';
          ui.transResult = null;
          ui.transCopied = false;
          renderUebersetzer(main);
          document.getElementById('trans-input')?.focus();
        });

        document.getElementById('btn-swap-lang')?.addEventListener('click', () => {
          ui.swapSpin = !ui.swapSpin;
          ui.transDir = ui.transDir === 'de-pular' ? 'pular-de' : 'de-pular';
          if (ui.transResult && ui.transResult.translation && ui.transResult.translation !== 'Keine Offline-Übereinstimmung') {
            ui.transInput = ui.transResult.translation;
            ui.transResult = null;
          }
          ui.transCopied = false;
          renderUebersetzer(main);
        });

        main.querySelectorAll('[data-ex]').forEach((btn) => {
          btn.addEventListener('click', () => {
            ui.transInput = btn.getAttribute('data-ex');
            runTranslate();
          });
        });

        document.getElementById('btn-copy-trans')?.addEventListener('click', () => {
          if (!ui.transResult) return;
          copyToClipboard(ui.transResult.translation);
          ui.transCopied = true;
          renderUebersetzer(main);
          showToast('Kopiert ✓');
        });

        document.getElementById('btn-toggle-history')?.addEventListener('click', (e) => {
          ui.historyOpen = !ui.historyOpen;
          const box = e.currentTarget.closest('.info-collapse');
          box?.classList.toggle('open', ui.historyOpen);
          e.currentTarget.setAttribute('aria-expanded', String(ui.historyOpen));
        });

        main.querySelectorAll('[data-hidx]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-hidx'));
            const item = state.history[idx];
            if (!item) return;
            ui.transDir = item.dir;
            ui.transInput = item.src;
            ui.transResult = {
              translation: item.translation,
              literalOrNote: item.literalOrNote,
              politeness: item.politeness,
              sourceLabel: item.sourceLabel,
            };
            ui.transCopied = false;
            ui.historyOpen = false;
            renderUebersetzer(main);
          });
        });

        document.getElementById('btn-clear-history')?.addEventListener('click', () => {
          state.history = [];
          ui.historyOpen = false;
          saveState();
          renderUebersetzer(main);
          showToast('Verlauf geleert');
        });
      }

      /* =======================================================================
         11. TAB 3: ÜBEN (KARTEIKARTEN & ALLTAGS-QUIZ)
         ======================================================================= */
      function buildDeck(shouldShuffle) {
        const list = PHRASES.filter((p) => {
          if (ui.cardCat !== 'all' && p.cat !== ui.cardCat) return false;
          if (ui.cardOnlyOpen && isMastered(p.id)) return false;
          return true;
        });
        ui.deck = shouldShuffle ? shuffle(list) : list;
        ui.cardIdx = 0;
        ui.cardFlipped = false;
      }

      function initQuiz() {
        ui.quizOrder = shuffle(QUIZ_QUESTIONS).map((item) => {
          const tagged = item.options.map((text, i) => ({ text, ok: i === item.correct }));
          const mixed = shuffle(tagged);
          return {
            q: item.q,
            options: mixed.map((m) => m.text),
            correct: mixed.findIndex((m) => m.ok),
            explain: item.explain,
          };
        });
        ui.quizIdx = 0;
        ui.quizScore = 0;
        ui.quizChosen = null;
        ui.quizDone = false;
      }

      function renderUeben(main) {
        if (ui.trainMode === 'cards' && ui.deck.length === 0 && !ui.cardOnlyOpen) {
          buildDeck(false);
        }
        if (ui.trainMode === 'quiz' && ui.quizOrder.length === 0) {
          initQuiz();
        }

        main.innerHTML = `
          <div class="view-enter" style="display:flex; flex-direction:column; gap:16px;">
            <div class="segmented" role="tablist">
              <button type="button" class="seg-btn ${ui.trainMode === 'cards' ? 'active' : ''}" data-tmode="cards">Karteikarten</button>
              <button type="button" class="seg-btn ${ui.trainMode === 'quiz' ? 'active' : ''}" data-tmode="quiz">Alltags-Quiz</button>
            </div>
            <div id="ueben-body"></div>
          </div>
        `;

        main.querySelectorAll('[data-tmode]').forEach((btn) => {
          btn.addEventListener('click', () => {
            ui.trainMode = btn.getAttribute('data-tmode');
            if (ui.trainMode === 'cards') buildDeck(false);
            if (ui.trainMode === 'quiz' && ui.quizOrder.length === 0) initQuiz();
            renderUeben(main);
          });
        });

        const body = document.getElementById('ueben-body');
        if (ui.trainMode === 'cards') renderCards(body);
        else renderQuiz(body);
      }

      function renderCards(container) {
        const pularFront = state.cardDir === 'pular-de';
        const len = ui.deck.length;
        const card = len > 0 ? ui.deck[ui.cardIdx % len] : null;
        const done = card ? isMastered(card.id) : false;

        const catOptions = [
          `<option value="all" ${ui.cardCat === 'all' ? 'selected' : ''}>Alle Kategorien</option>`,
          ...CATEGORIES.map((c) => `
            <option value="${c.id}" ${ui.cardCat === c.id ? 'selected' : ''}>${esc(c.label)}</option>
          `),
        ].join('');

        let stageHtml = '';
        if (!card) {
          stageHtml = `
            <div class="card empty-card">
              <h3>Alles gelernt</h3>
              <p>In dieser Auswahl sind keine offenen Karten mehr übrig.</p>
              <button id="btn-cards-all" type="button" class="btn-primary" style="width:auto; min-height:44px;">
                Alle wiederholen
              </button>
            </div>
          `;
        } else {
          const catObj = CATEGORIES.find((c) => c.id === card.cat);
          const frontText = pularFront ? card.pular : card.de;
          const backText = pularFront ? card.de : card.pular;

          stageHtml = `
            <div id="flip-stage" class="flip-stage" role="button" tabindex="0" aria-label="Karte umdrehen">
              <div id="flip-inner" class="flip-inner ${ui.cardFlipped ? 'flipped' : ''}">
                <div class="flip-face">
                  <div class="flip-top">
                    <span>${esc(catObj ? catObj.label : '')}</span>
                    <span>${pularFront ? 'Pular' : 'Deutsch'}</span>
                  </div>
                  <div class="flip-center">
                    <div class="flip-text">${esc(frontText)}</div>
                  </div>
                  <div class="flip-hint">Tippen zum Umdrehen</div>
                </div>

                <div class="flip-face flip-back">
                  <div class="flip-top">
                    <span>${esc(catObj ? catObj.label : '')}</span>
                    <span>${pularFront ? 'Deutsch' : 'Pular'}</span>
                  </div>
                  <div class="flip-center">
                    <div class="flip-text">${esc(backText)}</div>
                    ${card.note ? `<div class="flip-note">${esc(card.note)}</div>` : ''}
                  </div>
                  <div class="flip-hint">← Noch üben · Sitzt ✓ →</div>
                </div>
              </div>
            </div>

            <div class="two-col-actions">
              <button id="btn-card-again" type="button" class="btn-secondary">Noch üben</button>
              <button id="btn-card-ok" type="button" class="btn-primary">Sitzt ✓</button>
            </div>

            <div class="card-sub-nav">
              <span>${(ui.cardIdx % len) + 1} / ${len}${done ? ' · gelernt' : ''}</span>
              <button id="btn-card-shuffle" type="button" class="text-btn-muted" style="padding:4px 8px;">Mischen</button>
            </div>
          `;
        }

        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:14px;">
            <div class="compact-filter-bar">
              <select id="card-cat-select" class="clean-select" aria-label="Kategorie wählen">
                ${catOptions}
              </select>
              <button id="btn-card-dir" type="button" class="compact-chip">
                ${pularFront ? 'Pular → DE' : 'DE → Pular'}
              </button>
              <button id="btn-card-open" type="button" class="compact-chip ${ui.cardOnlyOpen ? 'active' : ''}">
                Nur offene
              </button>
            </div>
            ${stageHtml}
          </div>
        `;

        document.getElementById('card-cat-select')?.addEventListener('change', (e) => {
          ui.cardCat = e.target.value;
          buildDeck(false);
          renderCards(container);
        });

        document.getElementById('btn-card-dir')?.addEventListener('click', () => {
          state.cardDir = state.cardDir === 'pular-de' ? 'de-pular' : 'pular-de';
          ui.cardFlipped = false;
          saveState();
          renderCards(container);
        });

        document.getElementById('btn-card-open')?.addEventListener('click', () => {
          ui.cardOnlyOpen = !ui.cardOnlyOpen;
          buildDeck(false);
          renderCards(container);
        });

        document.getElementById('btn-cards-all')?.addEventListener('click', () => {
          ui.cardOnlyOpen = false;
          buildDeck(false);
          renderCards(container);
        });

        if (card) {
          const markAgain = () => {
            setMastered(card.id, false);
            ui.cardFlipped = false;
            ui.cardIdx = (ui.cardIdx + 1) % ui.deck.length;
            renderCards(container);
          };

          const markOk = () => {
            setMastered(card.id, true);
            ui.cardFlipped = false;
            if (ui.cardOnlyOpen) {
              ui.deck = ui.deck.filter((c) => c.id !== card.id);
              if (ui.cardIdx >= ui.deck.length) ui.cardIdx = 0;
            } else {
              ui.cardIdx = (ui.cardIdx + 1) % ui.deck.length;
            }
            renderCards(container);
          };

          const stage = document.getElementById('flip-stage');
          const inner = document.getElementById('flip-inner');
          let sx = 0;
          let sy = 0;
          let swiped = false;

          const doFlip = () => {
            ui.cardFlipped = !ui.cardFlipped;
            inner?.classList.toggle('flipped', ui.cardFlipped);
          };

          stage?.addEventListener('touchstart', (e) => {
            sx = e.changedTouches[0].screenX;
            sy = e.changedTouches[0].screenY;
            swiped = false;
          }, { passive: true });

          stage?.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].screenX - sx;
            const dy = e.changedTouches[0].screenY - sy;
            if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.2) {
              swiped = true;
              if (dx > 0) markOk();
              else markAgain();
            }
          }, { passive: true });

          stage?.addEventListener('click', () => {
            if (swiped) { swiped = false; return; }
            doFlip();
          });

          stage?.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
              e.preventDefault();
              doFlip();
            }
          });

          document.getElementById('btn-card-again')?.addEventListener('click', markAgain);
          document.getElementById('btn-card-ok')?.addEventListener('click', markOk);
          document.getElementById('btn-card-shuffle')?.addEventListener('click', () => {
            ui.deck = shuffle(ui.deck);
            ui.cardIdx = 0;
            ui.cardFlipped = false;
            showToast('Karten gemischt');
            renderCards(container);
          });
        }
      }

      function renderQuiz(container) {
        const total = ui.quizOrder.length;

        if (ui.quizDone) {
          const pct = Math.round((ui.quizScore / total) * 100);
          const headline = pct >= 85 ? 'No moyyi fota!' : pct >= 60 ? 'No marsude!' : 'Weiter so!';
          container.innerHTML = `
            <section class="card empty-card view-enter">
              <div style="font-size:36px; font-weight:700; color:var(--accent); margin-bottom:4px;">${ui.quizScore} / ${total}</div>
              <h3>${headline}</h3>
              <p>Du hast ${pct}% der Alltags-Situationen richtig beantwortet.</p>
              <button id="btn-quiz-again" type="button" class="btn-primary">Neue Runde starten</button>
            </section>
          `;
          document.getElementById('btn-quiz-again')?.addEventListener('click', () => {
            initQuiz();
            renderQuiz(container);
          });
          return;
        }

        const item = ui.quizOrder[ui.quizIdx];
        const pct = Math.round(((ui.quizIdx + (ui.quizChosen !== null ? 1 : 0)) / total) * 100);

        const optsHtml = item.options.map((opt, idx) => {
          let cls = '';
          if (ui.quizChosen !== null) {
            if (idx === item.correct) cls = 'correct';
            else if (idx === ui.quizChosen) cls = 'wrong';
            else cls = 'dim';
          }
          return `
            <button type="button" class="quiz-opt ${cls}" data-qopt="${idx}" ${ui.quizChosen !== null ? 'disabled' : ''}>
              ${esc(opt)}
            </button>
          `;
        }).join('');

        container.innerHTML = `
          <section class="card quiz-card view-enter">
            <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-secondary);">
              <span>Frage ${ui.quizIdx + 1} von ${total}</span>
              <span>${ui.quizScore} richtig</span>
            </div>
            <div class="progress-slim">
              <div class="progress-slim-fill" style="width:${pct}%;"></div>
            </div>

            <div class="quiz-question">${esc(item.q)}</div>
            <div class="quiz-opts">${optsHtml}</div>

            ${ui.quizChosen !== null ? `
              <div class="quiz-explain view-enter">
                <strong>${ui.quizChosen === item.correct ? 'Richtig.' : 'Hinweis:'}</strong> ${esc(item.explain)}
              </div>
              <button id="btn-quiz-next" type="button" class="btn-primary">
                ${ui.quizIdx + 1 < total ? 'Weiter' : 'Ergebnis anzeigen'}
              </button>
            ` : ''}
          </section>
        `;

        container.querySelectorAll('[data-qopt]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (ui.quizChosen !== null) return;
            const picked = Number(btn.getAttribute('data-qopt'));
            ui.quizChosen = picked;
            if (picked === item.correct) ui.quizScore++;
            renderQuiz(container);
          });
        });

        document.getElementById('btn-quiz-next')?.addEventListener('click', () => {
          if (ui.quizIdx + 1 < total) {
            ui.quizIdx++;
            ui.quizChosen = null;
          } else {
            ui.quizDone = true;
          }
          renderQuiz(container);
        });
      }

      /* =======================================================================
         12. TAB 4: BAUEN (SATZBAUER & BEFEHL / VERBOT)
         ======================================================================= */
      function buildGermanSentence(person, form, verb) {
        const s = person.deSubj;
        const pres = verb.pres[person.idx];
        const pastAux = verb.aux === 'sein' ? person.sein : person.haben;
        const exclNote = person.id === 'men' ? ' (ohne dich)' : person.id === 'en' ? ' (mit dir)' : '';

        switch (form.id) {
          case 'now':  return `${s} ${pres} gerade.${exclNote}`;
          case 'will': return `${s} ${person.will} ${verb.label}.${exclNote}`;
          case 'past': return `${s} ${pastAux} ${verb.part}.${exclNote}`;
          case 'fut':  return `${s} ${person.werden} ${verb.label}.${exclNote}`;
          case 'neg':  return `${s} ${pres} nicht / ${person.werden} nicht ${verb.label}.${exclNote}`;
          case 'can':  return `${s} ${person.kann} ${verb.label}.${exclNote}`;
          default:     return '';
        }
      }

      function renderBauen(main) {
        main.innerHTML = `
          <div class="view-enter" style="display:flex; flex-direction:column; gap:16px;">
            <div class="segmented" role="tablist">
              <button type="button" class="seg-btn ${ui.buildMode === 'satz' ? 'active' : ''}" data-bmode="satz">Satzbauer</button>
              <button type="button" class="seg-btn ${ui.buildMode === 'befehl' ? 'active' : ''}" data-bmode="befehl">Befehl &amp; Verbot</button>
            </div>
            <div id="bauen-body"></div>
          </div>
        `;

        main.querySelectorAll('[data-bmode]').forEach((btn) => {
          btn.addEventListener('click', () => {
            ui.buildMode = btn.getAttribute('data-bmode');
            renderBauen(main);
          });
        });

        const body = document.getElementById('bauen-body');
        if (ui.buildMode === 'satz') renderSatzbauer(body);
        else renderBefehl(body);
      }

      function renderSatzbauer(container) {
        const person = BUILDER_PERSONS.find((p) => p.id === ui.personId) || BUILDER_PERSONS[0];
        const form = BUILDER_FORMS.find((f) => f.id === ui.formId) || BUILDER_FORMS[0];
        const verb = BUILDER_VERBS.find((v) => v.id === ui.verbId) || BUILDER_VERBS[0];

        const pronText = form.pron === 'long' ? person.longP : person.shortP;
        const auxPart = form.aux ? `${form.aux} ` : '';
        const deText = buildGermanSentence(person, form, verb);

        const breakdownParts = [
          `${pronText.toLowerCase()} (${person.deLabel} · ${form.pron === 'long' ? 'lang' : 'kurz'})`,
          ...(form.aux ? [`${form.aux} (${form.id === 'will' ? 'will' : 'kann'})`] : []),
          `${verb.stem}- (${verb.label})`,
          `-${form.end} (${form.note})`,
        ];

        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:18px;">
            <!-- Live-Vorschau -->
            <section class="card preview-card" aria-live="polite">
              <div class="preview-pular">
                ${esc(pronText)} ${esc(auxPart)}${esc(verb.stem)}<span class="accent-end">${esc(form.end)}</span>.
              </div>
              <div class="preview-de">${esc(deText)}</div>
              <div class="preview-breakdown">${esc(breakdownParts.join(' + '))}</div>
            </section>

            <!-- 1. Person -->
            <div>
              <div class="section-eyebrow">1. Person</div>
              <div class="chip-grid-3">
                ${BUILDER_PERSONS.map((p) => `
                  <button type="button" class="select-chip ${p.id === person.id ? 'active' : ''}" data-bp="${p.id}">
                    <span class="sc-main">${esc(p.label)}</span>
                    <span class="sc-sub">${esc(p.deLabel)}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- 2. Form -->
            <div>
              <div class="section-eyebrow">2. Zeit / Form</div>
              <div class="chip-grid">
                ${BUILDER_FORMS.map((f) => `
                  <button type="button" class="select-chip ${f.id === form.id ? 'active' : ''}" data-bf="${f.id}">
                    <span class="sc-main">${esc(f.label)}</span>
                    <span class="sc-sub">${esc(f.sub)}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- 3. Verb -->
            <div>
              <div class="section-eyebrow">3. Verb (-ugol)</div>
              <div class="chip-grid">
                ${BUILDER_VERBS.map((v) => `
                  <button type="button" class="select-chip ${v.id === verb.id ? 'active' : ''}" data-bv="${v.id}">
                    <span class="sc-main">${esc(v.label)}</span>
                    <span class="sc-sub">${esc(v.inf)}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;

        container.querySelectorAll('[data-bp]').forEach((b) => {
          b.addEventListener('click', () => {
            ui.personId = b.getAttribute('data-bp');
            renderSatzbauer(container);
          });
        });

        container.querySelectorAll('[data-bf]').forEach((b) => {
          b.addEventListener('click', () => {
            ui.formId = b.getAttribute('data-bf');
            renderSatzbauer(container);
          });
        });

        container.querySelectorAll('[data-bv]').forEach((b) => {
          b.addEventListener('click', () => {
            ui.verbId = b.getAttribute('data-bv');
            renderSatzbauer(container);
          });
        });
      }

      function renderBefehl(container) {
        const verb = BUILDER_VERBS.find((v) => v.id === ui.verbId) || BUILDER_VERBS[0];
        const capStem = verb.stem.charAt(0).toUpperCase() + verb.stem.slice(1);
        const posPular = ui.cmdRespect ? `${capStem}ee!` : `${capStem}u!`;
        const negPular = ui.cmdRespect ? `Wata on ${verb.stem}u!` : `Wata a ${verb.stem}u!`;
        const posDe = ui.cmdRespect ? verb.impPl : verb.impSg;
        const negDe = ui.cmdRespect ? verb.noPl : verb.noSg;

        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:16px;">
            <div class="segmented" role="group" aria-label="Anrede wählen">
              <button type="button" class="seg-btn ${!ui.cmdRespect ? 'active' : ''}" data-cmdresp="0">Du (normal)</button>
              <button type="button" class="seg-btn ${ui.cmdRespect ? 'active' : ''}" data-cmdresp="1">Ihr / Respekt</button>
            </div>

            <div class="cmd-pair" aria-live="polite">
              <section class="card cmd-card">
                <div class="cmd-kicker">Befehl</div>
                <div class="cmd-pular">${esc(posPular)}</div>
                <div class="cmd-de">${esc(posDe)}</div>
              </section>

              <section class="card cmd-card">
                <div class="cmd-kicker neg">Verbot</div>
                <div class="cmd-pular">${esc(negPular)}</div>
                <div class="cmd-de">${esc(negDe)}</div>
              </section>
            </div>

            <div>
              <div class="section-eyebrow">Verb auswählen</div>
              <div class="chip-grid">
                ${BUILDER_VERBS.map((v) => `
                  <button type="button" class="select-chip ${v.id === verb.id ? 'active' : ''}" data-cv="${v.id}">
                    <span class="sc-main">${esc(v.label)}</span>
                    <span class="sc-sub">${esc(v.inf)}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;

        container.querySelectorAll('[data-cmdresp]').forEach((b) => {
          b.addEventListener('click', () => {
            ui.cmdRespect = b.getAttribute('data-cmdresp') === '1';
            renderBefehl(container);
          });
        });

        container.querySelectorAll('[data-cv]').forEach((b) => {
          b.addEventListener('click', () => {
            ui.verbId = b.getAttribute('data-cv');
            renderBefehl(container);
          });
        });
      }

      /* =======================================================================
         13. TAB 5: GRAMMATIK (8 KAPITEL – FOKUSSIERTES AKKORDEON)
         ======================================================================= */
      function renderGrammatik(main) {
        const itemsHtml = GRAMMAR_CHAPTERS.map((ch) => {
          const isOpen = ui.openGramId === ch.id;
          const picked = ui.gramChecks[ch.id];
          const answered = picked !== undefined;

          return `

              <div class="gram-content">
                <p class="gram-intro">${esc(ch.intro)}</p>

                <div class="formula-box">${ch.formula}</div>

                <div class="examples-list">
                  ${ch.examples.map(([pu, de]) => `
                    <div><b>${esc(pu)}</b> — ${esc(de)}</div>
                  `).join('')}
                </div>

                <div class="mini-check">
                  <div class="mini-check-label">Mini-Check</div>
                  <div class="mini-check-q">${esc(ch.check.q)}</div>
                  <div class="mini-opts">
                    ${ch.check.opts.map((opt, idx) => {
                      let cls = '';
                      if (answered) {
                        if (idx === ch.check.correct) cls = 'ok';
                        else if (idx === picked) cls = 'bad';
                      }
                      return `
                        <button type="button" class="mini-opt ${cls}" data-gcheck="${ch.id}" data-gopt="${idx}">
                          ${esc(opt)}
                        </button>
                      `;
                    }).join('')}
                  </div>
                  ${answered ? `
                    <div class="mini-feedback view-enter">
                      <strong>${picked === ch.check.correct ? 'Richtig.' : 'Lösung:'}</strong> ${esc(ch.check.explain)}
                    </div>
                  ` : ''}
                </div>
              </div>
            </article>
          `;
        }).join('');

        main.innerHTML = `
          <div class="gram-stack view-enter">
            ${itemsHtml}
          </div>
        `;

        main.querySelectorAll('[data-ghead]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = Number(btn.getAttribute('data-ghead'));
            ui.openGramId = ui.openGramId === id ? null : id;
            renderGrammatik(main);
          });
        });

        main.querySelectorAll('[data-gcheck]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const chId = Number(btn.getAttribute('data-gcheck'));
            const optIdx = Number(btn.getAttribute('data-gopt'));
            ui.gramChecks[chId] = optIdx;
            renderGrammatik(main);
          });
        });
      }

      /* =======================================================================
         14. INITIALISIERUNG
         ======================================================================= */
      function init() {
        applyTheme();
        buildDeck(false);
        initQuiz();

        document.querySelectorAll('.nav-btn').forEach((btn) => {
          btn.addEventListener('click', () => setTab(btn.dataset.tab));
        });

        document.getElementById('btn-theme')?.addEventListener('click', () => {
          state.theme = state.theme === 'light' ? 'dark' : 'light';
          saveState();
          applyTheme();
        });

        setTab('saetze');
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
