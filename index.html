<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#1d2520; --muted:#6b7570; --line:#e4ded2;
  --pri:#1f6f4a; --pri2:#e6f1eb; --acc:#c8861d; --acc2:#fbf1df; --bad:#c0392b; --bad2:#fbe9e7; --good:#2e8b57;
  --r:16px; --sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121614; --card:#1c221f; --ink:#eef2ef; --muted:#9aa59f; --line:#2c3530;
  --pri:#4fbf8a; --pri2:#1d3329; --acc:#e0a84a; --acc2:#3a2e18; --bad:#ef6b5b; --bad2:#3a1f1c; --good:#4fbf8a;
  --sh:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif}
body{padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;font-size:20px;padding:6px 8px;border-radius:10px;cursor:pointer;line-height:1}
.iconbtn:active{background:var(--line)}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;padding:7px 2px 6px}
nav.tabs a span{display:block;font-size:21px;line-height:1.2}
nav.tabs a.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:13px}
h2{font-size:20px;margin:6px 0 10px} h3{font-size:16px;margin:14px 0 8px} h4{margin:14px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn.sec{background:var(--pri2);color:var(--pri)} .btn.acc{background:var(--acc);color:#fff} .btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff} .btn.good{background:var(--good);color:#fff}
.btn.wide{width:100%} .btn:active{transform:scale(.98)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list a.item,.list .item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;text-decoration:none;color:inherit}
.item .em{font-size:26px;width:36px;text-align:center}
.item .tx{flex:1;min-width:0} .item .tx b{display:block} .item .tx small{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin:8px 0 12px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
.pr{padding:10px 2px;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .p{font-weight:600} .pr .d{color:var(--muted);font-size:14px}
.hideDe .pr .d,.hideDe .dl .d{filter:blur(5px);cursor:pointer} .hideDe .pr.show .d,.hideDe .dl.show .d{filter:none}
.dl{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.dl .s{font-weight:700;color:var(--acc);width:18px;flex:none}
.dl .p{font-weight:600} .dl .d{color:var(--muted);font-size:14px}
.chip{display:inline-block;padding:6px 11px;border-radius:999px;background:var(--pri2);color:var(--pri);font-size:13px;margin:3px 4px 3px 0;border:0;cursor:pointer;text-decoration:none}
.chip.on{background:var(--pri);color:#fff}
.tip{background:var(--acc2);border-radius:10px;padding:8px 10px;font-size:14px}
.tbl{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0 10px;display:block;overflow-x:auto}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--pri2);color:var(--pri);font-weight:600}
.gram p,.gram li{font-size:15px}
.gram i{color:var(--pri);font-style:normal;font-weight:600}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
select,input[type=text],input[type=number],input[type=search],textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
/* Karteikarte */
.flash{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px 16px;cursor:pointer;position:relative;user-select:none}
.flash .lang{position:absolute;top:10px;left:14px;font-size:12px;color:var(--muted)}
.flash .tools{position:absolute;top:4px;right:6px}
.flash .front{font-size:24px;font-weight:700;line-height:1.3}
.flash .back{margin-top:16px;font-size:19px;color:var(--pri);font-weight:600;border-top:1px solid var(--line);padding-top:14px;width:100%}
.flash .hint{margin-top:18px;font-size:13px;color:var(--muted)}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.ans .btn{padding:15px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:8px;cursor:pointer;font-weight:500}
.opt.ok{background:#dff3e7;border-color:var(--good);color:#145a32} .opt.no{background:var(--bad2);border-color:var(--bad)}
@media (prefers-color-scheme:dark){.opt.ok{background:#1d3a2b;color:#bff0d3}}
.big{font-size:34px;font-weight:800;color:var(--pri)}
.stat{text-align:center} .stat b{display:block;font-size:24px}
.kb{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.kb button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;font-size:17px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.conj td:first-child{color:var(--muted);font-size:13px;width:42%}
.conj td:last-child{font-weight:600}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.proverb{font-style:italic}
a{color:var(--pri)}

<p>Verben auf <b>-agol</b> (sich waschen: lootagol) und <b>-egol</b> (wollen: faalegol) haben andere Endungen:</p>

<p class="tip">Jedes Verb in allen Formen: <b>Verb-Konjugator</b>.</p>`},

<p><b>Nein</b>: kurzes Pronomen + -aa / -aaki / -aaka:</p>

<p class="tip">Bei „du“ hängt das Pronomen hinten dran: <i>yahataa</i> (gehst du), <i>iwuɗaa</i> (kamst du).</p>`},
{id:"imperativ",t:"Befehle, „soll“, „nicht!“",h:`
<p><b>Du</b>: -u (Aru! Komm!) bzw. -o (Jooɗo! Setz dich!).<br><b>Ihr / höflich</b>: -ee (Aree! Naatee!).<br><b>Lass uns</b>: -en (Yahen!).</p>

{id:"zahlen",t:"Zahlen",h:`

{id:"wann",t:"Wenn, bevor, müssen",h:`

<script>
/* ================= Speicher ================= */
const KEY = "pular_app_v2";
let S = {srs:{}, edits:{}, hidden:{}, custom:[], days:[], set:{dir:"pd", mode:"due", type:"all", lesson:"all", qlesson:"all", qtype:"all"}};
function load(){ try{ const r = localStorage.getItem(KEY); if(r){ const o = JSON.parse(r); S = Object.assign(S, o); S.set = Object.assign({dir:"pd",mode:"due",type:"all",lesson:"all",qlesson:"all",qtype:"all"}, o.set||{}); } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
load();

/* ================= Hilfen ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function norm(s){ return String(s).toLowerCase().replace(/ɓ/g,"b").replace(/ɗ/g,"d").replace(/ƴ/g,"y").replace(/ŋ/g,"n").replace(/ñ/g,"n")
  .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’'`´]/g,"").replace(/[.,!?;:„“"()…\/–-]/g," ").replace(/\s+/g," ").trim(); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const DAY = 864e5;
function today(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
const LMAP = {}; LESSONS.forEach(l => LMAP[l.id]=l);
const VMAP = {}; VERBS.forEach(v => VMAP[v[0]]=v[1]);
const TYPE_DE = {s:"Satz", w:"Wort", v:"Verb"};

/* ================= Karten aufbauen ================= */
let CARDS = [], CMAP = {};
function buildCards(){
  CARDS = []; CMAP = {};
  const add = (l,t,p,d) => { const id = l+":"+t+":"+hash(p); if(CMAP[id]) return; const c={id,l,t,p,d,op:p,od:d}; const e=S.edits[id]; if(e){ c.p=e.p; c.d=e.d; } CMAP[id]=c; if(!S.hidden[id]) CARDS.push(c); };
  LESSONS.forEach(L => { if(L.noCards) return;
    (L.phrases||[]).forEach(x => add(L.id,"s",x[0],x[1]));
    (L.vocab||[]).forEach(x => add(L.id,"w",x[0],x[1]));
    (L.verbs||[]).forEach(v => add(L.id,"v",v,VMAP[v]||""));
  });
  S.custom.forEach(c => { const o={id:c.id,l:"eigene",t:c.t||"w",p:c.p,d:c.d,custom:true}; CMAP[c.id]=o; CARDS.push(o); });
}
buildCards();
function lessonCards(lid){ return CARDS.filter(c => lid==="all" || c.l===lid); }
function known(c){ const s=S.srs[c.id]; return s && s.b>=2; }
function isDue(c,now){ const s=S.srs[c.id]; return s && s.d<=now; }
function isNew(c){ return !S.srs[c.id]; }
function lessonName(id){ return id==="eigene" ? "Eigene Karten" : (LMAP[id]? LMAP[id].t : id); }

/* SRS (Leitner) */
const INT = [0, 1, 2, 4, 8, 16, 35, 70]; // Tage
function grade(c, ok){
  const s = S.srs[c.id] || {b:0,d:0};
  if(ok){ s.b = Math.min(s.b+1, INT.length-1); s.d = Date.now() + INT[s.b]*DAY - 36e5; }
  else { s.b = 0; s.d = Date.now(); }
  S.srs[c.id]=s; markDay(); save();
}
function markDay(){ const t=today(); if(S.days[S.days.length-1]!==t){ S.days.push(t); if(S.days.length>400) S.days=S.days.slice(-400); } }
function streak(){
  let n=0; const d=new Date();
  for(let i=0;i<400;i++){ const k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); if(S.days.includes(k)) n++; else if(i>0) break; d.setDate(d.getDate()-1); }
  return n;
}

/* ================= Router ================= */
let stack = [];
function go(h){ if(location.hash===h) render(); else location.hash=h; }
window.addEventListener("hashchange", render);
function setTitle(t, back){ $("#title").textContent=t; const b=$("#backBtn"); b.style.visibility = back?"visible":"hidden"; b.onclick = () => go(back); }
function setTab(t){ document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.t===t)); }
function render(){
  const h = location.hash || "#home";
  const [r, a] = h.slice(1).split("/");
  closeModal();
  window.scrollTo(0,0);
  const V = $("#view");
  const routes = {
    home:()=>{setTab("home"); viewHome(V);},
    lessons:()=>{setTab("lessons"); viewLessons(V);},
    lesson:()=>{setTab("lessons"); viewLesson(V,a);},
    practice:()=>{setTab("practice"); viewPractice(V);},
    cards:()=>{setTab("practice"); viewCards(V);},
    quiz:()=>{setTab("practice"); viewQuiz(V);},
    grammar:()=>{setTab("grammar"); viewGrammar(V);},
    g:()=>{setTab("grammar"); viewGram(V,a);},
    conj:()=>{setTab("grammar"); viewConj(V,a?decodeURIComponent(a):null);},
    numbers:()=>{setTab("grammar"); viewNumbers(V);},
    search:()=>{setTab("search"); viewSearch(V);},
    settings:()=>{setTab(""); viewSettings(V);},
    mine:()=>{setTab("practice"); viewMine(V);}
  };
  (routes[r]||routes.home)();
}

/* ================= Start ================= */
function phraseOfDay(){
  const pool = []; LESSONS.forEach(L => { if(L.id!=="sprichwort" && L.id!=="zahlen") (L.phrases||[]).forEach(p => pool.push(p)); });
  const d = new Date(); const n = d.getFullYear()*400 + d.getMonth()*31 + d.getDate();
  return pool[n % pool.length];
}
function viewHome(V){
  setTitle("A jaraama! 👋");
  const now = Date.now();
  const due = CARDS.filter(c => isDue(c,now)).length;
  const learned = CARDS.filter(known).length;
  const started = CARDS.filter(c => !isNew(c)).length;
  const pod = phraseOfDay();
  V.innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><div class="muted small">Heute fällig</div><div class="big">${due}</div></div>
      <div class="stat"><b>${streak()} 🔥</b><span class="muted small">Tage am Stück</span></div>
    </div>
    <button class="btn wide" style="margin-top:10px" onclick="startDue()">${due? "▶ Jetzt wiederholen" : "▶ Neue Karten lernen"}</button>
  </div>
  <div class="grid2">
    <div class="card stat"><b>${learned}</b><span class="muted small">sitzen schon</span></div>
    <div class="card stat"><b>${started}/${CARDS.length}</b><span class="muted small">angefangen</span></div>
  </div>
  <div class="card"><div class="muted small">Satz des Tages</div><div style="font-size:19px;font-weight:700;margin-top:4px">${esc(pod[0])}</div><div class="muted">${esc(pod[1])}</div></div>
  <h3>Schnellzugriff</h3>
  <div class="list">
    <a class="item" href="#lesson/gruss"><span class="em">👋</span><span class="tx"><b>Mit Begrüßungen starten</b><small>Das Wichtigste zuerst</small></span>›</a>
    <a class="item" href="#quiz"><span class="em">❓</span><span class="tx"><b>Quiz</b><small>10 schnelle Fragen</small></span>›</a>
    <a class="item" href="#conj"><span class="em">🔁</span><span class="tx"><b>Verb-Konjugator</b><small>Jedes Verb in allen Formen</small></span>›</a>
    <a class="item" href="#numbers"><span class="em">🔢</span><span class="tx"><b>Zahlen-Trainer</b><small>Preise & Zahlen üben</small></span>›</a>
  </div>`;
}
function startDue(){ S.set.mode="due"; S.set.lesson="all"; S.set.type="all"; save(); session=null; go("#cards"); }

/* ================= Lektionen ================= */
function viewLessons(V){
  setTitle("Lektionen");
  V.innerHTML = `<p class="muted small">Der Reihe nach durchgehen – nach Lektion 2 kannst du schon ein Gespräch führen.</p><div class="list">` +
    LESSONS.map((L,i) => { const cs=lessonCards(L.id); const k=cs.filter(known).length; const pct=cs.length?Math.round(k/cs.length*100):0;
      return `<a class="item" href="#lesson/${L.id}"><span class="em">${L.ic}</span><span class="tx"><b>${i+1}. ${esc(L.t)}</b><small>${esc(L.pu)} · ${L.noCards?"zum Lesen":cs.length+" Karten"}</small><div class="bar"><i style="width:${pct}%"></i></div></span>›</a>`; }).join("") +
    (S.custom.length? `<a class="item" href="#mine"><span class="em">✍️</span><span class="tx"><b>Eigene Karten</b><small>${S.custom.length} Karten</small></span>›</a>`:"") + `</div>`;
}
let lessonTab = {};
function viewLesson(V, id){
  const L = LMAP[id]; if(!L) return go("#lessons");
  setTitle(L.ic+" "+L.t, "#lessons");
  const tabs = [];
  if(L.dialogs && L.dialogs.length) tabs.push(["dlg", L.id==="alltag"?"Lesetext":"Dialog"]);
  if(L.phrases && L.phrases.length) tabs.push(["ph","Sätze"]);
  if((L.vocab&&L.vocab.length) || (L.verbs&&L.verbs.length)) tabs.push(["vo","Wörter"]);
  if(L.g && L.g.length) tabs.push(["gr","Grammatik"]);
  if(L.kultur && L.kultur.length) tabs.push(["ku","Kultur"]);
  let cur = lessonTab[id] || tabs[0][0];
  const n = lessonCards(id).length;
  const draw = () => {
    let body = "";
    if(cur==="dlg") body = L.dialogs.map(D => `<div class="card"><h3 style="margin-top:0">${esc(D.t)}</h3>${D.lines.map(l=>`<div class="dl" onclick="this.classList.toggle('show')">${l[0]?`<span class="s">${esc(l[0])}</span>`:""}<div><div class="p">${esc(l[1])}</div><div class="d">${esc(l[2])}</div></div></div>`).join("")}</div>`).join("");
    if(cur==="ph") body = `<div class="card">${L.phrases.map(p=>`<div class="pr" onclick="this.classList.toggle('show')"><div class="p">${esc(p[0])}</div><div class="d">${esc(p[1])}</div></div>`).join("")}</div>`;
    if(cur==="vo") body = `<div class="card">${(L.vocab||[]).map(p=>`<div class="pr" onclick="this.classList.toggle('show')"><div class="p">${esc(p[0])}</div><div class="d">${esc(p[1])}</div></div>`).join("")}</div>` +
      (L.verbs&&L.verbs.length? `<h3>Verben <span class="muted small">(antippen = alle Formen)</span></h3><div class="card">${L.verbs.map(v=>`<div class="pr show" onclick="go('#conj/${encodeURIComponent(v)}')"><div class="p">${esc(v)} <span class="tag">konjugieren ›</span></div><div class="d">${esc(VMAP[v]||"")}</div></div>`).join("")}</div>`:"");
    if(cur==="gr") body = `<div class="list">${L.g.map(gid=>{const G=GRAMMAR.find(x=>x.id===gid); return G?`<a class="item" href="#g/${gid}"><span class="em">📐</span><span class="tx"><b>${esc(G.t)}</b></span>›</a>`:"";}).join("")}</div>`;
    if(cur==="ku") body = L.kultur.map(k=>`<div class="card"><b>${esc(k[0])}</b><div style="margin-top:4px">${esc(k[1])}</div></div>`).join("");

function buildQueue(){

      const picks = []; const seen = new Set([norm(c[key])]);

      return {c, dir, ask: dir==="pd"?c.p:c.d, right: c[key], opts: shuffle(picks.concat([c[key]]))};
    });

  }
  const q = Q.qs[Q.i];
  V.innerHTML = `<div class="row small muted" style="justify-content:space-between"><span>Frage ${Q.i+1} / ${Q.qs.length}</span><span>✅ ${Q.score}</span></div>
    <div class="bar" style="margin-bottom:12px"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
    <div class="card" style="text-align:center"><div class="muted small">${q.dir==="pd"?"Was bedeutet das?":"Wie sagt man das auf Pular?"}</div><div style="font-size:22px;font-weight:700;margin-top:6px">${esc(q.ask)}</div></div>
    <div id="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <div id="qnext"></div>`;

    if(Q.answered!==null) return;

}

/* ================= Konjugator ================= */
const PERS = [
 {s:"mi",l:"miɗo",de:"ich"},{s:"a",l:"hiɗa",de:"du",inv:"a"},{s:"o",l:"himo",de:"er/sie"},
 {s:"en",l:"hiɗen",de:"wir (mit dir)",inv:"en"},{s:"men",l:"meɗen",de:"wir (ohne dich)"},{s:"on",l:"hiɗon",de:"ihr / Sie",inv:"on"},{s:"ɓe",l:"hiɓe",de:"sie (Pl.)"}];
const END = {
  past:{u:"ii",a:"ike",e:"aama"}, pastN:{u:"aali",a:"aaki",e:"aaka"},
  stat:{u:"i",a:"ii",e:"aa"}, statN:{u:"aa",a:"aaki",e:"aaka"},
  prog:{u:"ude",a:"aade",e:"eede"}, hab:{u:"a",a:"oo",e:"ee"},
  fut:{u:"ay",a:"oto",e:"ete"}, futN:{u:"ataa",a:"otaako",e:"etaake"},
  focI:{u:"ata",a:"oto",e:"ete"}, des:{u:"u",a:"o",e:"e"}
};
const INVP = {a:{u:"uɗa",a:"iɗa",e:"aɗa"}, en:{u:"uɗen",a:"iɗen",e:"aɗen"}, on:{u:"uɗon",a:"iɗon",e:"aɗon"}};
const INVI = {a:{u:"ataa",a:"otoɗa",e:"eteɗa"}, en:{u:"aten",a:"otoɗen",e:"eteɗen"}, on:{u:"aton",a:"otoɗon",e:"eteɗon"}};
const IMP = {a:{u:"u",a:"o"}, en:{u:"en",a:"oɗen"}, on:{u:"ee",a:"ee"}};
function parseVerb(inf){
  inf = inf.trim().toLowerCase(); const w = inf.split(/\s+/); const v = w[0], rest = w.slice(1).join(" ");
  let t, r;
  if(v.endsWith("ugol")){ t="u"; r=v.slice(0,-4); } else if(v.endsWith("agol")){ t="a"; r=v.slice(0,-4); } else if(v.endsWith("egol")){ t="e"; r=v.slice(0,-4); } else if(v.endsWith("gol")){ t="u"; r=v.slice(0,-3); } else return null;
  if(!r) return null; return {t, r, rest: rest? " "+rest : ""};
}
function conjugate(inf, P){
  const V = parseVerb(inf); if(!V) return null;
  const {t,r,rest} = V; const f = e => r + e[t] + rest;
  const rows = [];
  rows.push(["Vergangenheit", cap(P.s)+" "+f(END.past), "hat getan (abgeschlossen)"]);
  rows.push(["Vergangenheit verneint", cap(P.s)+" "+f(END.pastN), "hat nicht getan"]);
  rows.push(["Zustand", cap(P.l)+" "+f(END.stat), "ist so / ist erledigt"]);
  rows.push(["Zustand verneint", cap(P.s)+" "+f(END.statN), "ist nicht so"]);
  rows.push(["Gerade dabei", cap(P.l)+" "+f(END.prog), "ist gerade dabei"]);
  rows.push(["Gerade nicht", cap(P.s)+" alaa "+f(END.prog), "ist gerade nicht dabei"]);
  rows.push(["Gewohnheit", cap(P.l)+" "+f(END.hab), "tut es regelmäßig"]);
  rows.push(["Zukunft", cap(P.s)+" "+f(END.fut), "wird tun"]);
  rows.push(["Zukunft verneint", cap(P.s)+" "+f(END.futN), "wird nicht tun"]);
  rows.push(["Fokus Vergangenheit", P.inv? "Ko … "+r+INVP[P.inv][t]+rest : "Ko … "+P.s+" "+f(END.stat), "für Fragen/Betonung: Ko honto …?"]);
  rows.push(["Fokus Zukunft", P.inv? "Ko … "+r+INVI[P.inv][t]+rest : "Ko … "+P.s+" "+f(END.focI), "für Fragen/Betonung (jetzt/später)"]);
  rows.push(["Soll (yo)", "Yo "+P.s+" "+f(END.des), "… soll …"]);
  rows.push(["Soll nicht (wata)", "Wata "+P.s+" "+f(END.des), "… soll nicht …"]);
  if(P.inv && t!=="e") rows.push(["Befehl", cap(r+IMP[P.inv][t]+rest)+"!", P.inv==="a"?"(du)!":P.inv==="en"?"lass uns …!":"(ihr / Sie)!"]);
  return rows;
}
let conjP = 0;
function viewConj(V, pre){
  setTitle("Verb-Konjugator", "#grammar");
  const cur = pre || S.set.lastVerb || "yahugol";
  V.innerHTML = `<div class="card">

    <label class="f">… oder eigenes Verb eintippen (Grundform auf -ugol / -agol / -egol)</label>

      <table class="tbl conj" style="display:table">${rows.map(r=>`<tr><td>${r[0]}<br><span class="small">${r[2]}</span></td><td>${esc(r[1])}</td></tr>`).join("")}</table>`;
  };
  let curInf = cur;

  $("#cin").oninput = e => { const v=e.target.value.trim(); if(v){ curInf=v; show(v); } };
  V.querySelectorAll("#cp .chip").forEach(b => b.onclick = () => { conjP=+b.dataset.i; V.querySelectorAll("#cp .chip").forEach(x=>x.classList.toggle("on", x===b)); show(curInf); });
  show(curInf);

/* ================= Zahlen ================= */
const UN = ["","go'o","ɗiɗi","tati","nay","jowi","jeego","jeeɗiɗi","jeetati","jeenay"];
const UP = ["","gooto","ɗiɗo","tato","nayo","jowo","jeego","jeeɗiɗo","jeetato","jeenayo"];
function under100(n, ppl){
  const t=Math.floor(n/10), u=n%10, parts=[];
  if(t===1) parts.push("sappo"); else if(t===2) parts.push(ppl?"nogayo":"nogay"); else if(t>2) parts.push("cappande "+(ppl?UP[t]:UN[t]));
  if(u){ if(ppl) parts.push(t>0 && u===1 ? "go'o" : UP[u]); else parts.push(UN[u]); }
  return parts.join(" e ");
}
function under1000(n, ppl){
  const h=Math.floor(n/100), r=n%100, parts=[];
  if(h===1) parts.push("teemedere"); else if(h>1) parts.push("teemeɗɗe "+UN[h]);
  if(r) parts.push(under100(r, ppl && n<100));
  return parts.join(" e ");
}
function numPular(n, ppl){
  n=Math.floor(n); if(!(n>0) || n>999999) return "";
  const th=Math.floor(n/1000), r=n%1000, parts=[];
  if(th===1) parts.push("wuluure"); else if(th>1) parts.push("guluuji "+under1000(th,false));
  if(r) parts.push(under1000(r, ppl && n<100));
  return parts.join(" e ");
}
let numState = {range:"10", mode:"np", ppl:false, n:null, shown:false, ok:0, tot:0};
function rndNum(){
  const r=numState.range;
  if(r==="10") return 1+Math.floor(Math.random()*10);
  if(r==="100") return 1+Math.floor(Math.random()*99);
  if(r==="1000") return 100+Math.floor(Math.random()*900);
  return (1+Math.floor(Math.random()*60))*500; // Preise
}
function viewNumbers(V){
  setTitle("Zahlen-Trainer", "#grammar");

  V.innerHTML = `<div class="card"><label class="f">Umrechnen: Zahl eingeben</label>
    <input type="number" id="nin" inputmode="numeric" placeholder="z. B. 2750"><div id="nout" style="margin-top:8px;font-weight:700;color:var(--pri)"></div>
    <label class="small muted" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="nppl" ${N.ppl?"checked":""}> Personen zählen (gooto, ɗiɗo …)</label></div>
  <div class="card"><h3 style="margin-top:0">Trainer</h3>
    <div class="seg" id="nr">${[["10","1–10"],["100","1–99"],["1000","100–999"],["preis","Preise"]].map(o=>`<button data-v="${o[0]}" class="${N.range===o[0]?"on":""}">${o[1]}</button>`).join("")}</div>
    <div class="seg" id="nm">${[["np","Zahl → Pular"],["pn","Pular → Zahl"]].map(o=>`<button data-v="${o[0]}" class="${N.mode===o[0]?"on":""}">${o[1]}</button>`).join("")}</div>
    <div style="text-align:center;padding:10px 0">
      ${N.mode==="np" ? `<div class="big">${N.n.toLocaleString("de-DE")}${ppl?" 👤":""}</div>
        ${N.shown? `<div style="font-size:20px;font-weight:700;margin-top:8px">${esc(numPular(N.n,ppl))}</div>`:`<div class="muted small">Sag es laut auf Pular, dann aufdecken.</div>`}`
      : `<div style="font-size:21px;font-weight:700">${esc(numPular(N.n,ppl))}</div>
        <input type="number" id="nguess" inputmode="numeric" placeholder="Welche Zahl?" style="margin-top:10px;text-align:center">
        <div id="nres" style="margin-top:8px"></div>`}
    </div>
    <div class="row">${N.mode==="np" && !N.shown ? `<button class="btn wide" id="nshow">Aufdecken</button>` : N.mode==="pn" ? `<button class="btn wide" id="ncheck">Prüfen</button>`:""}
      <button class="btn sec wide" id="nnext">Nächste Zahl ›</button></div>
    ${N.tot?`<p class="muted small" style="text-align:center">${N.ok} / ${N.tot} richtig</p>`:""}
  </div>`;
  const nin=$("#nin"); nin.oninput = () => { const v=+nin.value; $("#nout").textContent = v? (numPular(v, N.ppl && v<100) || "Bitte 1 – 999.999") : ""; };
  $("#nppl").onchange = e => { N.ppl=e.target.checked; viewNumbers(V); };
  V.querySelectorAll("#nr button").forEach(b => b.onclick = () => { N.range=b.dataset.v; N.n=rndNum(); N.shown=false; viewNumbers(V); });
  V.querySelectorAll("#nm button").forEach(b => b.onclick = () => { N.mode=b.dataset.v; N.shown=false; viewNumbers(V); });
  if($("#nshow")) $("#nshow").onclick = () => { N.shown=true; viewNumbers(V); };
  if($("#ncheck")) $("#ncheck").onclick = () => { const g=+$("#nguess").value; N.tot++; const ok=g===N.n; if(ok) N.ok++;
    $("#nres").innerHTML = ok? `<b style="color:var(--good)">✅ Richtig!</b>` : `<b style="color:var(--bad)">Leider nein – ${N.n.toLocaleString("de-DE")}</b>`; $("#ncheck").disabled=true; };
  $("#nnext").onclick = () => { N.n=rndNum(); N.shown=false; viewNumbers(V); };
}

/* ================= Suche ================= */
let lastQ = "";
function viewSearch(V){
  setTitle("Wörterbuch");
  V.innerHTML = `<input type="search" id="sq" placeholder="Pular oder Deutsch suchen …" autocapitalize="off" autocomplete="off" value="${esc(lastQ)}">
    <div class="kb" data-for="sq"></div>
    <p class="muted small">ɓ, ɗ, ƴ, ŋ, ñ kannst du auch einfach als b, d, y, n tippen.</p><div id="sres"></div>`;
  addKb(V);
  const run = () => {
    const q = norm($("#sq").value); lastQ=$("#sq").value;
    if(q.length<2){ $("#sres").innerHTML = `<div class="empty">Mindestens 2 Buchstaben eingeben.<br>${CARDS.length} Einträge + ${VERBS.length} Verben</div>`; return; }
    const items = CARDS.map(c=>({p:c.p,d:c.d,l:c.l,t:c.t}));
    VERBS.forEach(v => { if(!items.some(i=>i.p===v[0])) items.push({p:v[0],d:v[1],l:"",t:"v"}); });
    const res = items.map(i => { const np=norm(i.p), nd=norm(i.d); let sc=0;
      if(np===q||nd===q) sc=3; else if(np.split(" ").includes(q)||nd.split(" ").includes(q)) sc=2; else if(np.includes(q)||nd.includes(q)) sc=1; return {i,sc}; })
      .filter(x=>x.sc).sort((a,b)=>b.sc-a.sc || a.i.p.length-b.i.p.length).slice(0,80);
    $("#sres").innerHTML = res.length? `<div class="card">${res.map(({i})=>`<div class="pr" ${i.t==="v"?`onclick="go('#conj/${encodeURIComponent(i.p)}')" style="cursor:pointer"`:""}><div class="row" style="justify-content:space-between"><span class="p">${esc(i.p)}</span>${i.l?`<span class="tag">${esc(lessonName(i.l))}</span>`:`<span class="tag">Verb</span>`}</div><div class="d">${esc(i.d)}</div></div>`).join("")}</div>` : `<div class="empty">Nichts gefunden.<br><br><button class="btn sec" onclick="newCard()">+ Als eigene Karte anlegen</button></div>`;
  };
  $("#sq").oninput = run; run();
}

/* ================= Eigene Karten ================= */
function viewMine(V){
  setTitle("Eigene Karten", "#practice");
  const hid = Object.keys(S.hidden).map(id=>CMAP[id]).filter(Boolean);
  const edited = Object.keys(S.edits).map(id=>CMAP[id]).filter(Boolean);
  V.innerHTML = `<button class="btn wide" onclick="newCard()">+ Neue Karte</button>
    <h3>Meine Karten (${S.custom.length})</h3>
    ${S.custom.length? `<div class="card">${S.custom.map(c=>`<div class="pr row" style="justify-content:space-between;flex-wrap:nowrap"><div><div class="p">${esc(c.p)}</div><div class="d">${esc(c.d)}</div></div><button class="iconbtn" onclick="editCard(CMAP['${c.id}'],()=>render())">✏️</button></div>`).join("")}</div>
      <button class="btn sec wide" onclick="practiceLesson('eigene')">🃏 Eigene Karten üben</button>` : `<p class="muted">Noch keine. Füg Wörter hinzu, die du im Alltag hörst!</p>`}
    ${edited.length? `<h3>Bearbeitete Karten (${edited.length})</h3><div class="card">${edited.map(c=>`<div class="pr row" style="justify-content:space-between;flex-wrap:nowrap"><div><div class="p">${esc(c.p)}</div><div class="d">${esc(c.d)}</div></div><button class="iconbtn" onclick="editCard(CMAP['${c.id}'],()=>render())">✏️</button></div>`).join("")}</div>`:""}
    ${hid.length? `<h3>Ausgeblendete Karten (${hid.length})</h3><div class="card">${hid.map(c=>`<div class="pr row" style="justify-content:space-between;flex-wrap:nowrap"><div><div class="p">${esc(c.p)}</div><div class="d">${esc(c.d)}</div></div><button class="btn sec" onclick="unhide('${c.id}')">↩︎</button></div>`).join("")}</div>`:""}`;
}
function unhide(id){ delete S.hidden[id]; save(); buildCards(); render(); }
function newCard(){ editCard(null, () => { buildCards(); if(location.hash==="#mine") render(); }); }
function editCard(c, done){
  const isNewC = !c;
  openModal(`<h2 style="margin-top:0">${isNewC?"Neue Karte":"Karte bearbeiten"}</h2>
    <label class="f">Pular</label><input type="text" id="ep" value="${esc(c?c.p:"")}" autocapitalize="off" autocomplete="off"><div class="kb" data-for="ep"></div>
    <label class="f">Deutsch</label><input type="text" id="ed" value="${esc(c?c.d:"")}">
    ${isNewC?`<label class="f">Art</label><select id="et"><option value="w">Wort</option><option value="s">Satz</option><option value="v">Verb</option></select>`:""}
    <div class="row" style="margin-top:14px"><button class="btn" id="esave">Speichern</button><button class="btn ghost" id="ecancel">Abbrechen</button></div>
    ${!isNewC? `<div class="row" style="margin-top:14px">${(!c.custom && S.edits[c.id])?`<button class="btn sec" id="ereset">Original wiederherstellen</button>`:""}<button class="btn bad" id="edel">${c.custom?"Löschen":"Ausblenden"}</button></div>`:""}`);
  addKb($("#modalRoot"));
  $("#ecancel").onclick = closeModal;
  $("#esave").onclick = () => {
    const p=$("#ep").value.trim(), d=$("#ed").value.trim(); if(!p||!d){ alert("Bitte beide Felder ausfüllen."); return; }
    if(isNewC){ S.custom.push({id:"eigene:"+Date.now().toString(36), p, d, t:$("#et").value}); }
    else if(c.custom){ const o=S.custom.find(x=>x.id===c.id); if(o){ o.p=p; o.d=d; } }
    else { if(p===c.op && d===c.od) delete S.edits[c.id]; else S.edits[c.id]={p,d}; }
    save(); buildCards(); if(c){ const n=CMAP[c.id]; if(n){ c.p=n.p; c.d=n.d; } } closeModal(); done && done();
  };
  if($("#ereset")) $("#ereset").onclick = () => { delete S.edits[c.id]; save(); buildCards(); c.p=c.op; c.d=c.od; closeModal(); done&&done(); };
  if($("#edel")) $("#edel").onclick = () => {
    if(!confirm(c.custom?"Karte löschen?":"Karte ausblenden? (Unter „Eigene Karten“ wiederherstellbar)")) return;
    if(c.custom){ S.custom = S.custom.filter(x=>x.id!==c.id); delete S.srs[c.id]; } else S.hidden[c.id]=1;
    save(); buildCards(); closeModal();
    if(session && location.hash==="#cards"){ session.q = session.q.filter(x=>x.id!==c.id); if(session.i>session.q.length) session.i=session.q.length; session.flipped=false; drawCard(); } else render();
  };
}
function openModal(html){ $("#modalRoot").innerHTML = `<div class="modal" id="mod"><div class="sheet">${html}</div></div>`; $("#mod").onclick = e => { if(e.target.id==="mod") closeModal(); }; }
function closeModal(){ const m=$("#modalRoot"); if(m) m.innerHTML=""; }
function addKb(root){
  root.querySelectorAll(".kb").forEach(k => {
    k.innerHTML = ["ɓ","ɗ","ƴ","ŋ","ñ","'"].map(ch=>`<button type="button">${ch}</button>`).join("");
    const inp = document.getElementById(k.dataset.for);
    k.querySelectorAll("button").forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => {
      const s=inp.selectionStart??inp.value.length, e2=inp.selectionEnd??inp.value.length;
      inp.value = inp.value.slice(0,s)+b.textContent+inp.value.slice(e2); inp.focus();
      try{ inp.setSelectionRange(s+1,s+1); }catch(_){}
      inp.dispatchEvent(new Event("input")); }; });
  });
}

/* ================= Einstellungen ================= */
function viewSettings(V){
  setTitle("Einstellungen", "#home");
  V.innerHTML = `<div class="card"><h3 style="margin-top:0">💾 Sicherung</h3>
    <p class="small muted">Dein Fortschritt liegt nur auf diesem Gerät. Ab und zu sichern – z. B. den Text in die Notizen kopieren.</p>
    <button class="btn sec" id="bexp">Sicherung erstellen</button>
    <textarea id="btx" placeholder="Hier erscheint die Sicherung – oder eine Sicherung zum Wiederherstellen einfügen." style="margin-top:10px"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="bcopy">Kopieren</button><button class="btn ghost" id="bimp">Wiederherstellen</button></div></div>
  <div class="card"><h3 style="margin-top:0">📲 Auf den Homescreen</h3><p class="small">In Safari: Teilen-Symbol ⎋ → „Zum Home-Bildschirm“. Dann startet die App wie eine echte App, auch offline.</p></div>
  <div class="card"><h3 style="margin-top:0">↺ Zurücksetzen</h3><button class="btn bad" id="breset">Lernfortschritt löschen</button>
    <p class="small muted">Eigene und bearbeitete Karten bleiben erhalten.</p></div>
  <div class="card small muted">Inhalte basieren auf dem Peace-Corps-Lehrbuch „Learner's Guide to Pular (Fuuta Jallon)“, gekürzt und auf Deutsch übertragen. Dialekt: Pular Fuuta (Guinea).</div>`;
  $("#bexp").onclick = () => { $("#btx").value = JSON.stringify(S); };
  $("#bcopy").onclick = () => { const t=$("#btx"); if(!t.value) t.value=JSON.stringify(S); t.select(); try{ navigator.clipboard.writeText(t.value).then(()=>alert("Kopiert!"),()=>document.execCommand("copy")); }catch(e){ document.execCommand("copy"); } };
  $("#bimp").onclick = () => { try{ const o=JSON.parse($("#btx").value); if(!o.srs) throw 0; S=Object.assign(S,o); save(); buildCards(); alert("Wiederhergestellt ✅"); go("#home"); }catch(e){ alert("Das ist keine gültige Sicherung."); } };
  $("#breset").onclick = () => { if(confirm("Wirklich den ganzen Lernfortschritt löschen?")){ S.srs={}; S.days=[]; save(); alert("Zurückgesetzt."); go("#home"); } };
}

render();

</script>
