<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pular" />
  <meta name="theme-color" content="#F5F5F7" />
  <title>Miɗo waawi Pular! – Fuuta Jallon</title>
  <!-- Inline SVG App-Icon für iPhone Home-Bildschirm & Browser-Tab -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230F766E'/%3E%3Ctext x='90' y='108' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-size='74' font-weight='700' fill='%23FFFFFF'%3E%C9%93%C9%97%3C/text%3E%3Ctext x='90' y='146' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-size='22' font-weight='600' letter-spacing='1.5' fill='rgba(255,255,255,0.82)'%3EPULAR%3C/text%3E%3C/svg%3E" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F766E'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='-apple-system,sans-serif' font-size='28' font-weight='700' fill='%23FFFFFF'%3E%C9%93%C9%97%3C/text%3E%3C/svg%3E" />
  <style>
    /* =========================================================================
       1. DESIGN TOKENS — CALM APPLE / iOS MINIMALISM (LIGHT + OLED DARK)
       ========================================================================= */
    :root {
      --bg-outer: #EBEBEF;
      --bg-canvas: #F5F5F7;
      --bg-card: #FFFFFF;
      --bg-subtle: #F2F2F7;
      --bg-segment: #E5E5EA;
      --bg-nav: rgba(255, 255, 255, 0.84);
      --bg-header: rgba(245, 245, 247, 0.86);

      --border-hairline: rgba(0, 0, 0, 0.06);
      --border-control: rgba(0, 0, 0, 0.11);

      --text-primary: #111827;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;

      --accent: #0F766E;
      --accent-hover: #0D655E;
      --accent-soft: rgba(15, 118, 110, 0.09);
      --accent-soft-strong: rgba(15, 118, 110, 0.16);
      --accent-on: #FFFFFF;

      --part-pron: #0F766E;
      --part-aux: #0369A1;
      --part-stem: #111827;
      --part-end: #B45309;

      --danger: #DC2626;
      --danger-soft: rgba(220, 38, 38, 0.09);

      --amber-text: #B45309;
      --amber-soft: rgba(217, 119, 6, 0.10);

      --violet-text: #6D28D9;
      --violet-soft: rgba(109, 40, 217, 0.09);

      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.03);
      --shadow-shell: 0 20px 50px rgba(0, 0, 0, 0.08);
      --shadow-seg: 0 1px 3px rgba(0, 0, 0, 0.09);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-pill: 999px;
      --nav-height: 64px;
    }

    html[data-theme="dark"] {
      --bg-outer: #000000;
      --bg-canvas: #000000;
      --bg-card: #1C1C1E;
      --bg-subtle: #2C2C2E;
      --bg-segment: #2C2C2E;
      --bg-nav: rgba(28, 28, 30, 0.86);
      --bg-header: rgba(0, 0, 0, 0.84);

      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-control: rgba(255, 255, 255, 0.15);

      --text-primary: #F9FAFB;
      --text-secondary: #9CA3AF;
      --text-tertiary: #6B7280;

      --accent: #2DD4BF;
      --accent-hover: #14B8A6;
      --accent-soft: rgba(45, 212, 191, 0.13);
      --accent-soft-strong: rgba(45, 212, 191, 0.22);
      --accent-on: #042F2E;

      --part-pron: #2DD4BF;
      --part-aux: #38BDF8;
      --part-stem: #F9FAFB;
      --part-end: #FBBF24;

      --danger: #F87171;
      --danger-soft: rgba(248, 113, 113, 0.14);

      --amber-text: #FBBF24;
      --amber-soft: rgba(251, 191, 36, 0.13);

      --violet-text: #C4B5FD;
      --violet-soft: rgba(167, 139, 250, 0.14);

      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-shell: 0 20px 60px rgba(0, 0, 0, 0.65);
      --shadow-seg: 0 1px 3px rgba(0, 0, 0, 0.45);
    }

    /* =========================================================================
       2. RESET & BASE TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--bg-outer);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.48;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      transition: transform 0.12s ease, opacity 0.15s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      cursor: default;
    }

    /* =========================================================================
       3. APP SHELL (MOBILE-FIRST + CENTERED DESKTOP FRAME)
       ========================================================================= */
    .app-shell {
      position: relative;
      margin: 0 auto;
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 560px) {
      .app-shell {
        margin: 16px auto;
        min-height: calc(100vh - 32px);
        border-radius: 28px;
        border: 1px solid var(--border-hairline);
        box-shadow: var(--shadow-shell);
        overflow: hidden;
      }
    }

    /* Minimalistische Top Bar */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-header);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-hairline);
      padding: calc(13px + env(safe-area-inset-top, 0px)) 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-brand {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .header-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.15;
      color: var(--text-primary);
    }

    .header-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-pill);
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-card);
      flex-shrink: 0;
    }

    .icon-btn:hover {
      color: var(--text-primary);
    }

    .icon-btn.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: transparent;
    }

    /* Hauptbereich */
    .main-content {
      flex: 1;
      padding: 16px 20px calc(var(--nav-height) + 30px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .view-enter {
      animation: fadeSlide 0.18s ease-out;
    }

    /* Feste 5-Tab Bottom-Navigation (Frosted Glass) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      z-index: 40;
      background: var(--bg-nav);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
      border-top: 1px solid var(--border-hairline);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
    }

    @media (min-width: 560px) {
      .bottom-nav {
        position: sticky;
        left: 0;
        transform: none;
      }
    }

    .nav-btn {
      min-height: 52px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 1.85;
    }

    .nav-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    .nav-btn.active svg {
      stroke-width: 2.2;
    }

    /* =========================================================================
       4. SHARED COMPONENTS
       ========================================================================= */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 3px;
      background: var(--bg-segment);
      border-radius: 12px;
      gap: 3px;
    }

    .seg-btn {
      min-height: 38px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seg-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: var(--shadow-seg);
    }

    .btn-primary {
      width: 100%;
      min-height: 48px;
      padding: 0 20px;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: var(--accent-on);
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.45;
    }

    .btn-secondary {
      width: 100%;
      min-height: 48px;
      padding: 0 18px;
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .section-eyebrow {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      padding: 0 4px;
      margin-bottom: 8px;
    }

    .pills-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .pill {
      flex-shrink: 0;
      min-height: 36px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-on);
      font-weight: 600;
    }

    .empty-card {
      padding: 36px 20px;
      text-align: center;
    }

    .empty-card h3 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 600;
    }

    .empty-card p {
      margin: 0 0 16px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .info-collapse {
      overflow: hidden;
    }

    .info-collapse-btn {
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .info-collapse-body {
      display: none;
      padding: 0 16px 14px;
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.55;
      border-top: 1px solid var(--border-hairline);
    }

    .info-collapse.open .info-collapse-body {
      display: block;
      padding-top: 12px;
    }

    .chev {
      width: 18px;
      height: 18px;
      color: var(--text-tertiary);
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .open > button .chev {
      transform: rotate(180deg);
    }

    .progress-slim {
      width: 100%;
      height: 4px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      overflow: hidden;
    }

    .progress-slim-fill {
      height: 100%;
      background: var(--accent);
      border-radius: var(--radius-pill);
      transition: width 0.28s ease;
    }

    .text-btn-muted {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .text-btn-muted:hover {
      color: var(--danger);
      background: var(--danger-soft);
    }

    /* =========================================================================
       5. TAB 1: ÜBERSETZER (GOOGLE TRANSLATE STYLE + SPECIAL LETTERS + API KEY)
       ========================================================================= */
    .lang-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      align-items: center;
      padding: 6px 8px;
      gap: 6px;
    }

    .lang-label {
      text-align: center;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      padding: 8px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .swap-btn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .swap-btn:hover {
      background: var(--accent-soft);
    }

    .swap-btn svg {
      transition: transform 0.25s ease;
    }

    .swap-btn.rotated svg {
      transform: rotate(180deg);
    }

    .gear-mini {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-pill);
      color: var(--text-tertiary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .gear-mini:hover, .gear-mini.has-key {
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* API-Key-Einstellungsbox (optional für GitHub Pages) */
    .apikey-panel {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .apikey-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .apikey-desc {
      margin: 0;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.48;
    }

    .apikey-row {
      display: flex;
      gap: 8px;
    }

    .apikey-input {
      flex: 1;
      min-height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-control);
      font-size: 14px;
      outline: none;
    }

    .apikey-input:focus {
      border-color: var(--accent);
    }

    .apikey-save {
      min-height: 42px;
      padding: 0 14px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-on);
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .trans-input-card {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .trans-textarea-wrap {
      position: relative;
    }

    .trans-textarea {
      width: 100%;
      min-height: 96px;
      padding: 4px 36px 4px 0;
      border: none;
      background: transparent;
      resize: none;
      outline: none;
      font-size: 18px;
      line-height: 1.45;
      color: var(--text-primary);
    }

    .trans-textarea::placeholder {
      color: var(--text-tertiary);
    }

    .trans-clear-btn {
      position: absolute;
      top: 0;
      right: -4px;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-pill);
      color: var(--text-tertiary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .trans-clear-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    /* 1-Tap Sonderzeichen-Leiste für iPhone (ɓ, ɗ, ƴ, ñ) */
    .special-chars-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-hairline);
    }

    .special-chars-label {
      font-size: 12px;
      color: var(--text-tertiary);
      font-weight: 500;
      white-space: nowrap;
    }

    .special-chars-btns {
      display: flex;
      gap: 6px;
    }

    .char-key {
      min-width: 40px;
      height: 34px;
      border-radius: 9px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-hairline);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .char-key:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .example-chip {
      min-height: 34px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .example-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .trans-output-card {
      padding: 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .trans-result-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.32;
      color: var(--accent);
      word-break: break-word;
    }

    .trans-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .copy-btn {
      min-height: 36px;
      padding: 0 12px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .copy-btn.copied {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .source-indicator {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
    }

    .trans-divider {
      height: 1px;
      background: var(--border-hairline);
      margin: 2px 0;
    }

    .trans-note-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .trans-tone {
      display: inline-flex;
      align-self: flex-start;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 9px;
      border-radius: 6px;
    }

    .trans-note-text {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin: 0;
    }

    .skeleton-line {
      height: 22px;
      border-radius: 8px;
      background: var(--bg-subtle);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    .history-list {
      display: none;
      border-top: 1px solid var(--border-hairline);
    }

    .info-collapse.open .history-list {
      display: block;
    }

    .history-item {
      width: 100%;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-item:last-of-type {
      border-bottom: none;
    }

    .history-item:hover {
      background: var(--bg-subtle);
    }

    .history-src {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .history-tgt {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .history-footer {
      padding: 8px 16px 12px;
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid var(--border-hairline);
    }

      /* =======================================================================

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Wandelt ɓ→b, ɗ→d, ƴ→y, ñ→n um, damit Suche & Offline-Match immer klappen
      function foldPular(str) {
        return String(str || '')
          .toLowerCase()
          .replace(/ɓ/g, 'b')
          .replace(/ɗ/g, 'd')
          .replace(/ƴ/g, 'y')
          .replace(/ñ/g, 'n')
          .replace(/ä/g, 'a')
          .replace(/ö/g, 'o')
          .replace(/ü/g, 'u')
          .replace(/ß/g, 'ss')
          .replace(/[?!.,„“"()…'’]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function shuffle(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = copy[i];
          copy[i] = copy[j];
          copy[j] = tmp;
        }
        return copy;
      }

      function isMastered(id) {
        return state.masteredIds.includes(id);
      }

      function setMastered(id, val) {
        const idx = state.masteredIds.indexOf(id);
        if (val && idx === -1) {
          state.masteredIds.push(id);
          saveState();
        } else if (!val && idx !== -1) {
          state.masteredIds.splice(idx, 1);
          saveState();
        }
      }

      function toggleMastered(id) {
        const next = !isMastered(id);
        setMastered(id, next);
        return next;
      }

      function copyToClipboard(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (e) {
          return false;
        }
      }

        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 1700);
      }

      function lookupLocalExact(input, dir) {
        const norm = foldPular(input);
        if (!norm) return null;

        for (let i = 0; i < PHRASES.length; i++) {
          const p = PHRASES[i];
          const srcField = dir === 'de-pular' ? p.de : p.pular;
          const tgtField = dir === 'de-pular' ? p.pular : p.de;

          const cleaned = srcField.replace(/\(.*?\)/g, '');
          const variants = cleaned.split('/').map((s) => foldPular(s));
          const fullNorm = foldPular(cleaned);

          if (norm === fullNorm || variants.includes(norm)) {
            const toneMap = {
              Respekt: 'höflich',
              Grenzen: 'direkt',
              Streit: 'direkt',
              Sanakuyaagal: 'locker',
            };
            return {
              translation: tgtField,
              literalOrNote: p.note || (dir === 'de-pular' ? `Alltagsform im Fuuta Jallon für „${p.de}“` : `Entspricht im Deutschen „${p.de}“`),
              tone: toneMap[p.tag] || 'locker',
              sourceLabel: 'Offline-Wörterbuch',
            };
          }
        }

        // Einzelwort-Exact-Match im Kernwörterbuch
        for (let i = 0; i < EXTRA_DICT.length; i++) {
          const [deW, puW] = EXTRA_DICT[i];
          if (dir === 'de-pular' && foldPular(deW) === norm) {
            return {
              translation: puW,
              literalOrNote: 'Kernvokabel im Pular (Fuuta Jallon).',
              tone: 'locker',
              sourceLabel: 'Offline-Wörterbuch',
            };
          }
          if (dir === 'pular-de') {
            const pularOpts = puW.split('/').map((s) => foldPular(s));
            if (pularOpts.includes(norm)) {
              return {
                translation: deW.charAt(0).toUpperCase() + deW.slice(1),
                literalOrNote: 'Kernvokabel aus dem Pular (Fuuta Jallon).',
                tone: 'locker',
                sourceLabel: 'Offline-Wörterbuch',
              };
            }
          }
        }
        return null;
      }

      function lookupLocalFallback(input, dir) {
        const norm = foldPular(input);
        const tokens = norm.split(' ').filter((t) => t.length > 1);

        let bestPhrase = null;
        let bestScore = 0;

        for (let i = 0; i < PHRASES.length; i++) {
          const p = PHRASES[i];
          const hay = foldPular(dir === 'de-pular' ? p.de : p.pular);
          if (hay.includes(norm) && norm.length >= 4) {
            const score = norm.length / Math.max(hay.length, 1) + 1.5;
            if (score > bestScore) {
              bestScore = score;
              bestPhrase = p;
            }
          } else if (tokens.length > 0) {
            let hits = 0;
            for (let t = 0; t < tokens.length; t++) {
              if (hay.includes(tokens[t])) hits++;
            }
            if (hits / tokens.length >= 0.5 && hits > bestScore) {
              bestScore = hits;
              bestPhrase = p;
            }
          }
        }

        if (bestPhrase) {
          return {
            translation: dir === 'de-pular' ? bestPhrase.pular : bestPhrase.de,
            literalOrNote: `Nächster Offline-Treffer (${bestPhrase.pular} = ${bestPhrase.de}). Für exakte freie Sätze online verbinden oder oben im Zahnrad einen Gemini-Key speichern.`,
            tone: 'direkt',
            sourceLabel: 'Offline-Wörterbuch (ungefähr)',
          };
        }

        // Wort-für-Wort-Annäherung
        const words = norm.split(' ').filter(Boolean);
        const mapped = [];
        let hits = 0;

        for (let w = 0; w < words.length; w++) {
          const word = words[w];
          let found = null;
          for (let j = 0; j < EXTRA_DICT.length; j++) {
            const deW = foldPular(EXTRA_DICT[j][0]);
            const puFirst = EXTRA_DICT[j][1].split('/')[0].trim();
            if (dir === 'de-pular' && deW === word) {
              found = puFirst;
              break;
            }
            if (dir === 'pular-de' && EXTRA_DICT[j][1].split('/').map(foldPular).includes(word)) {
              found = EXTRA_DICT[j][0];
              break;
            }
          }
          if (found) {
            mapped.push(found);
            hits++;
          } else {
            mapped.push(word);
          }
        }

        if (hits > 0) {
          return {
            translation: mapped.join(' '),
            literalOrNote: 'Wort-für-Wort-Annäherung aus dem Offline-Wörterbuch (ohne Live-KI).',
            tone: 'locker',
            sourceLabel: 'Offline-Wörterbuch (ungefähr)',
          };
        }

        return {
          translation: 'Keine Offline-Übereinstimmung',
          literalOrNote: 'Nicht im Offline-Wörterbuch gefunden und Live-KI ist gerade nicht erreichbar (für GitHub Pages ggf. eigenen Gemini-Key im Zahnrad hinterlegen).',
          tone: '',
          sourceLabel: 'Offline-Wörterbuch (ungefähr)',
        };
      }

3. Übersetze natürlich, alltagstauglich und direkt (80/20-Verständigung). Auch Grenzen, derbe Sprüche oder Beleidigungen sachlich und authentisch übersetzen.
4. Antworte strikt im geforderten JSON-Schema mit:
   - translation: fertige Übersetzung
   - literalOrNote: maximal 1–2 kurze, hilfreiche Sätze auf Deutsch (wörtliche Zerlegung oder Tipp)
   - tone: genau eines der Wörter "höflich", "locker" oder "direkt".`;

        const userPrompt = dir === 'de-pular'
          ? `Übersetze ins Pular (Fuuta Jallon, Guinea) mit korrekter ɓ/ɗ/ƴ/ñ-Schreibweise: "${text}"`
          : `Übersetze aus dem Pular (Fuuta Jallon, Guinea) ins Deutsche: "${text}"`;

        const payload = {
          contents: [{ parts: [{ text: userPrompt }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: {
                translation: { type: 'STRING' },
                literalOrNote: { type: 'STRING' },
                tone: { type: 'STRING' },
              },
              required: ['translation', 'literalOrNote', 'tone'],
            },
          },
        };

        const delays = [1000, 2000, 4000];
        let lastErr = null;

        for (let attempt = 0; attempt <= delays.length; attempt++) {
          try {
            const res = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (res.status === 429 || res.status >= 500) {
              if (attempt < delays.length) {
                await new Promise((r) => setTimeout(r, delays[attempt]));
                continue;
              }
            }

            if (!res.ok) throw new Error('HTTP ' + res.status);

            const data = await res.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!rawText) throw new Error('Leere Antwort');

            const parsed = JSON.parse(rawText);
            if (!parsed.translation) throw new Error('Kein Übersetzungstext');

            return {
              translation: parsed.translation.trim(),
              literalOrNote: (parsed.literalOrNote || '').trim(),
              tone: (parsed.tone || 'locker').trim(),
              sourceLabel: 'KI · Fuuta Jallon',
            };
          } catch (err) {
            lastErr = err;
            if (attempt < delays.length) {
              await new Promise((r) => setTimeout(r, delays[attempt]));
            }
          }
        }
        throw lastErr || new Error('Übersetzung fehlgeschlagen');
      }

      function pushHistory(entry) {
        const filtered = state.history.filter(
          (h) => !(h.dir === entry.dir && foldPular(h.src) === foldPular(entry.src))
        );
        state.history = [entry, ...filtered].slice(0, 12);
        saveState();
      }

      async function runTranslate() {
        const text = ui.transInput.trim();
        if (!text || ui.transLoading) return;

        ui.transCopied = false;

        // 1. Sofortige akzent-unabhängige Offline-Suche
        const exact = lookupLocalExact(text, ui.transDir);
        if (exact) {
          ui.transResult = exact;
          ui.transLoading = false;
          pushHistory({ dir: ui.transDir, src: text, ...exact });
          renderUebersetzer(document.getElementById('main-content'));
          return;
        }

        // 2. Live-KI (Gemini API) mit nahtlosem Offline-Fallback
        ui.transLoading = true;
        ui.transResult = null;
        renderUebersetzer(document.getElementById('main-content'));

        try {
          const aiRes = await fetchGeminiTranslation(text, ui.transDir);
          ui.transResult = aiRes;
          pushHistory({ dir: ui.transDir, src: text, ...aiRes });
        } catch (e) {
          const fb = lookupLocalFallback(text, ui.transDir);
          ui.transResult = fb;
          if (fb.translation !== 'Keine Offline-Übereinstimmung') {
            pushHistory({ dir: ui.transDir, src: text, ...fb });
          }
        } finally {
          ui.transLoading = false;
          if (ui.tab === 'uebersetzer') {
            renderUebersetzer(document.getElementById('main-content'));
          }
        }
      }

      function getFilteredPhrases() {
        const q = foldPular(ui.search);
        return PHRASES.filter((p) => {
          if (ui.phraseCat !== 'all' && p.cat !== ui.phraseCat) return false;
          if (ui.phraseFilter === 'open' && isMastered(p.id)) return false;
          if (q) {
            const hay = foldPular(`${p.pular} ${p.de} ${p.note || ''} ${p.tag || ''}`);
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      function tagClass(tag) {
        if (tag === 'Respekt') return 'tag-respect';
        if (tag === 'Grenzen') return 'tag-grenzen';
        if (tag === 'Sanakuyaagal') return 'tag-sanaku';
        if (tag === 'Streit') return 'tag-streit';
        return '';
      }

                Alle anzeigen
              </button>
            </div>

        return list.map((p) => {
          const done = isMastered(p.id);
          const hasFoot = Boolean(p.tag || p.note);
          return `
            <article class="card phrase-card">
              <div class="phrase-main">
                <div class="phrase-pular">${esc(p.pular)}</div>
                <div class="phrase-de">${esc(p.de)}</div>

                  <div class="phrase-foot">

              <svg class="ico-search" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"></circle>
                <path stroke-linecap="round" d="M20 20l-3.5-3.5"></path>

              <input id="phrase-search" class="search-input" type="search" value="${esc(ui.search)}" placeholder="Suchen (z. B. mido, be, moyyi)..." autocomplete="off" />
              ${ui.search ? `
                <button id="btn-search-clear" class="clear-x" type="button" aria-label="Suche leeren">
                  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">

            <div class="filter-meta-row">
              <div class="slim-seg" role="tablist">

                <button type="button" class="${ui.phraseFilter === 'open' ? 'active' : ''}" data-pfilter="open">Nur offene</button>

              <span id="quiet-progress" class="quiet-progress">${count} / ${PHRASES.length} sitzt</span>

            <div class="progress-slim">
              <div id="phrase-progress-bar" class="progress-slim-fill" style="width:${pct}%;"></div>

        `;

        const input = document.getElementById('phrase-search');
        input?.addEventListener('input', (e) => {
          ui.search = e.target.value;
          const wrap = document.getElementById('phrase-list-wrap');
          if (wrap) {
            wrap.innerHTML = renderPhraseListHtml();
            bindPhraseEvents(wrap);
          }
          const clr = document.getElementById('btn-search-clear');
          if (ui.search && !clr) {
            const b = document.createElement('button');
            b.id = 'btn-search-clear';
            b.className = 'clear-x';
            b.type = 'button';
            b.setAttribute('aria-label', 'Suche leeren');
            b.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>';
            b.addEventListener('click', () => {
              ui.search = '';
              renderSaetze(main);
            });
            input.parentElement.appendChild(b);
          } else if (!ui.search && clr) {
            clr.remove();
          }
        });

        document.getElementById('btn-search-clear')?.addEventListener('click', () => {
          ui.search = '';
          renderSaetze(main);
        });

        main.querySelectorAll('[data-pfilter]').forEach((btn) => {
          btn.addEventListener('click', () => {
            ui.phraseFilter = btn.getAttribute('data-pfilter');
            renderSaetze(main);
          });
        });

        main.querySelectorAll('[data-cat]').forEach((btn) => {
          btn.addEventListener('click', () => {
            ui.phraseCat = btn.getAttribute('data-cat');
            renderSaetze(main);
          });
        });

        document.getElementById('btn-sanaku')?.addEventListener('click', (e) => {
          ui.sanakuOpen = !ui.sanakuOpen;
          const box = e.currentTarget.closest('.info-collapse');
          box?.classList.toggle('open', ui.sanakuOpen);
          e.currentTarget.setAttribute('aria-expanded', String(ui.sanakuOpen));
        });

        bindPhraseEvents(document.getElementById('phrase-list-wrap'));
      }

      /* =======================================================================
         11. TAB 3: ÜBEN (3D FLASHCARDS & 20-FRAGEN-ALLTAGS-QUIZ)
         ======================================================================= */
      function buildDeck(shouldShuffle) {
        const list = PHRASES.filter((p) => {
          if (ui.cardCat !== 'all' && p.cat !== ui.cardCat) return false;
          if (ui.cardOnlyOpen && isMastered(p.id)) return false;
          return true;
        });
        ui.deck = shouldShuffle ? shuffle(list) : list;
        ui.cardIdx = 0;
        ui.cardFlipped = false;
      }

      function initQuiz() {
        ui.quizOrder = shuffle(QUIZ_QUESTIONS).map((item) => {
          const tagged = item.options.map((text, i) => ({ text, ok: i === item.correct }));
          const mixed = shuffle(tagged);
          return {
            q: item.q,
            options: mixed.map((m) => m.text),
            correct: mixed.findIndex((m) => m.ok),
            explain: item.explain,
          };
        });
        ui.quizIdx = 0;
        ui.quizScore = 0;
        ui.quizChosen = null;
        ui.quizDone = false;
      }

      function renderUeben(main) {
        if (ui.trainMode === 'cards' && ui.deck.length === 0 && !ui.cardOnlyOpen) {
          buildDeck(false);
        }
        if (ui.trainMode === 'quiz' && ui.quizOrder.length === 0) {
          initQuiz();
        }

        main.innerHTML = `
          <div class="view-enter" style="display:flex; flex-direction:column; gap:16px;">
            <div class="segmented" role="tablist">
              <button type="button" class="seg-btn ${ui.trainMode === 'cards' ? 'active' : ''}" data-tmode="cards">Karten</button>
              <button type="button" class="seg-btn ${ui.trainMode === 'quiz' ? 'active' : ''}" data-tmode="quiz">Alltags-Quiz</button>
            </div>
            <div id="ueben-body"></div>
          </div>
        `;

        main.querySelectorAll('[data-tmode]').forEach((btn) => {
          btn.addEventListener('click', () => {
            ui.trainMode = btn.getAttribute('data-tmode');
            if (ui.trainMode === 'cards') buildDeck(false);
            if (ui.trainMode === 'quiz' && ui.quizOrder.length === 0) initQuiz();
            renderUeben(main);
          });
        });

        const body = document.getElementById('ueben-body');
        if (ui.trainMode === 'cards') renderCards(body);
        else renderQuiz(body);
      }

      function renderCards(container) {
        const pularFront = state.cardDir === 'pular-de';
        const len = ui.deck.length;
        const card = len > 0 ? ui.deck[ui.cardIdx % len] : null;
        const done = card ? isMastered(card.id) : false;

        const catOptions = [
          `<option value="all" ${ui.cardCat === 'all' ? 'selected' : ''}>Alle Kategorien</option>`,
          ...CATEGORIES.map((c) => `
            <option value="${c.id}" ${ui.cardCat === c.id ? 'selected' : ''}>${esc(c.label)}</option>
          `),
        ].join('');

        let stageHtml = '';
        if (!card) {
          stageHtml = `
            <div class="card empty-card">
              <h3>Alles sitzt ✓</h3>
              <p>In dieser Auswahl sind keine offenen Karten mehr übrig.</p>
              <button id="btn-cards-all" type="button" class="btn-primary" style="width:auto; min-height:44px;">
                Alle wiederholen
              </button>
            </div>
          `;
        } else {
          const catObj = CATEGORIES.find((c) => c.id === card.cat);
          const frontText = pularFront ? card.pular : card.de;
          const backText = pularFront ? card.de : card.pular;

          stageHtml = `
            <div id="flip-stage" class="flip-stage" role="button" tabindex="0" aria-label="Karte umdrehen">
              <div id="flip-inner" class="flip-inner ${ui.cardFlipped ? 'flipped' : ''}">
                <div class="flip-face">
                  <div class="flip-top">
                    <span>${esc(catObj ? catObj.label : '')}</span>
                    <span>${pularFront ? 'Pular' : 'Deutsch'}</span>
                  </div>
                  <div class="flip-center">
                    <div class="flip-text">${esc(frontText)}</div>
                  </div>
                  <div class="flip-hint">Tippen zum Umdrehen</div>
                </div>

                <div class="flip-face flip-back">
                  <div class="flip-top">
                    <span>${esc(catObj ? catObj.label : '')}</span>
                    <span>${pularFront ? 'Deutsch' : 'Pular'}</span>
                  </div>
                  <div class="flip-center">
                    <div class="flip-text">${esc(backText)}</div>
                    ${card.note ? `<div class="flip-note">${esc(card.note)}</div>` : ''}
                  </div>
                  <div class="flip-hint">← Noch üben · Sitzt ✓ →</div>
                </div>
              </div>
            </div>

            <div class="two-col-actions">
              <button id="btn-card-again" type="button" class="btn-secondary">Noch üben</button>
              <button id="btn-card-ok" type="button" class="btn-primary">Sitzt ✓</button>
            </div>

            <div class="card-sub-nav">
              <span>${(ui.cardIdx % len) + 1} / ${len}${done ? ' · sitzt ✓' : ''}</span>
              <button id="btn-card-shuffle" type="button" class="text-btn-muted" style="padding:4px 8px;">Mischen</button>
            </div>
          `;
        }

        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:14px;">
            <div class="compact-filter-bar">
              <select id="card-cat-select" class="clean-select" aria-label="Kategorie wählen">
                ${catOptions}
              </select>
              <button id="btn-card-dir" type="button" class="compact-chip">
                ${pularFront ? 'Pular → DE' : 'DE → Pular'}
              </button>
              <button id="btn-card-open" type="button" class="compact-chip ${ui.cardOnlyOpen ? 'active' : ''}">
                Nur offene
              </button>
            </div>
            ${stageHtml}
          </div>
        `;

        document.getElementById('card-cat-select')?.addEventListener('change', (e) => {
          ui.cardCat = e.target.value;
          buildDeck(false);
          renderCards(container);
        });

        document.getElementById('btn-card-dir')?.addEventListener('click', () => {
          state.cardDir = state.cardDir === 'pular-de' ? 'de-pular' : 'pular-de';
          ui.cardFlipped = false;
          saveState();
          renderCards(container);
        });

        document.getElementById('btn-card-open')?.addEventListener('click', () => {
          ui.cardOnlyOpen = !ui.cardOnlyOpen;
          buildDeck(false);
          renderCards(container);
        });

        document.getElementById('btn-cards-all')?.addEventListener('click', () => {
          ui.cardOnlyOpen = false;
          buildDeck(false);
          renderCards(container);
        });

        if (card) {
          const markAgain = () => {
            setMastered(card.id, false);
            ui.cardFlipped = false;
            ui.cardIdx = (ui.cardIdx + 1) % ui.deck.length;
            renderCards(container);
          };

          const markOk = () => {
            setMastered(card.id, true);
            ui.cardFlipped = false;
            if (ui.cardOnlyOpen) {
              ui.deck = ui.deck.filter((c) => c.id !== card.id);
              if (ui.cardIdx >= ui.deck.length) ui.cardIdx = 0;
            } else {
              ui.cardIdx = (ui.cardIdx + 1) % ui.deck.length;
            }
            renderCards(container);
          };

          const stage = document.getElementById('flip-stage');
          const inner = document.getElementById('flip-inner');
          let sx = 0;
          let sy = 0;
          let swiped = false;

          const doFlip = () => {
            ui.cardFlipped = !ui.cardFlipped;
            inner?.classList.toggle('flipped', ui.cardFlipped);
          };

          stage?.addEventListener('touchstart', (e) => {
            sx = e.changedTouches[0].screenX;
            sy = e.changedTouches[0].screenY;
            swiped = false;
          }, { passive: true });

          stage?.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].screenX - sx;
            const dy = e.changedTouches[0].screenY - sy;
            if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.2) {
              swiped = true;
              if (dx > 0) markOk();
              else markAgain();
            }
          }, { passive: true });

          stage?.addEventListener('click', () => {
            if (swiped) { swiped = false; return; }
            doFlip();
          });

          stage?.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
              e.preventDefault();
              doFlip();
            }
          });

          document.getElementById('btn-card-again')?.addEventListener('click', markAgain);
          document.getElementById('btn-card-ok')?.addEventListener('click', markOk);
          document.getElementById('btn-card-shuffle')?.addEventListener('click', () => {
            ui.deck = shuffle(ui.deck);
            ui.cardIdx = 0;
            ui.cardFlipped = false;
            showToast('Karten gemischt');
            renderCards(container);
          });
        }
      }

      function renderQuiz(container) {
        const total = ui.quizOrder.length;

        if (ui.quizDone) {
          const pct = Math.round((ui.quizScore / total) * 100);
          const headline = pct >= 85 ? 'No moƴƴi fota!' : pct >= 60 ? 'No marsude!' : 'Weiter so!';
          container.innerHTML = `
            <section class="card empty-card view-enter">
              <div style="font-size:36px; font-weight:700; color:var(--accent); margin-bottom:4px;">${ui.quizScore} / ${total}</div>
              <h3>${headline}</h3>
              <p>Du hast ${pct} % der Alltags-Situationen richtig gelöst.</p>
              <button id="btn-quiz-again" type="button" class="btn-primary">Neue Runde starten</button>
            </section>
          `;
          document.getElementById('btn-quiz-again')?.addEventListener('click', () => {
            initQuiz();
            renderQuiz(container);
          });
          return;
        }

        const item = ui.quizOrder[ui.quizIdx];
        const pct = Math.round(((ui.quizIdx + (ui.quizChosen !== null ? 1 : 0)) / total) * 100);

        const optsHtml = item.options.map((opt, idx) => {
          let cls = '';
          if (ui.quizChosen !== null) {
            if (idx === item.correct) cls = 'correct';
            else if (idx === ui.quizChosen) cls = 'wrong';
            else cls = 'dim';
          }
          return `
            <button type="button" class="quiz-opt ${cls}" data-qopt="${idx}" ${ui.quizChosen !== null ? 'disabled' : ''}>
              ${esc(opt)}
            </button>
          `;
        }).join('');

        container.innerHTML = `
          <section class="card quiz-card view-enter">
            <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-secondary);">
              <span>Frage ${ui.quizIdx + 1} von ${total}</span>
              <span>${ui.quizScore} richtig</span>
            </div>
            <div class="progress-slim">
              <div class="progress-slim-fill" style="width:${pct}%;"></div>
            </div>

            <div class="quiz-question">${esc(item.q)}</div>
            <div class="quiz-opts">${optsHtml}</div>

            ${ui.quizChosen !== null ? `
              <div class="quiz-explain view-enter">
                <strong>${ui.quizChosen === item.correct ? 'Richtig.' : 'Hinweis:'}</strong> ${esc(item.explain)}
              </div>
              <button id="btn-quiz-next" type="button" class="btn-primary">
                ${ui.quizIdx + 1 < total ? 'Weiter' : 'Ergebnis anzeigen'}
              </button>
            ` : ''}
          </section>
        `;

        container.querySelectorAll('[data-qopt]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (ui.quizChosen !== null) return;
            const picked = Number(btn.getAttribute('data-qopt'));
            ui.quizChosen = picked;
            if (picked === item.correct) ui.quizScore++;
            renderQuiz(container);
          });
        });

        document.getElementById('btn-quiz-next')?.addEventListener('click', () => {
          if (ui.quizIdx + 1 < total) {
            ui.quizIdx++;
            ui.quizChosen = null;
          } else {
            ui.quizDone = true;
          }
          renderQuiz(container);
        });
      }

      /* =======================================================================
         12. TAB 4: BAUEN (SATZBAUER & BEFEHL / VERBOT)
         ======================================================================= */
      function buildGermanSentence(person, form, verb) {
        const s = person.deSubj;
        const pres = verb.pres[person.idx];
        const pastAux = verb.aux === 'sein' ? person.sein : person.haben;
        const exclNote = person.id === 'men' ? ' (ohne dich)' : person.id === 'en' ? ' (mit dir)' : '';

        switch (form.id) {
          case 'now':  return `${s} ${pres} gerade.${exclNote}`;
          case 'fut':  return `${s} ${person.werden} ${verb.label}.${exclNote}`;
          case 'past': return `${s} ${pastAux} ${verb.part}.${exclNote}`;
          case 'will': return `${s} ${person.will} ${verb.label}.${exclNote}`;
          case 'can':  return `${s} ${person.kann} ${verb.label}.${exclNote}`;
          case 'neg':  return `${s} ${pres} nicht / ${person.werden} nicht ${verb.label}.${exclNote}`;
          default:     return '';
        }
      }

      function renderBauen(main) {
        main.innerHTML = `
          <div class="view-enter" style="display:flex; flex-direction:column; gap:16px;">
            <div class="segmented" role="tablist">
              <button type="button" class="seg-btn ${ui.buildMode === 'satz' ? 'active' : ''}" data-bmode="satz">Satzbauer</button>
              <button type="button" class="seg-btn ${ui.buildMode === 'befehl' ? 'active' : ''}" data-bmode="befehl">Befehl &amp; Verbot</button>
            </div>
            <div id="bauen-body"></div>
          </div>
        `;

        main.querySelectorAll('[data-bmode]').forEach((btn) => {
          btn.addEventListener('click', () => {
            ui.buildMode = btn.getAttribute('data-bmode');
            renderBauen(main);
          });
        });

        const body = document.getElementById('bauen-body');
        if (ui.buildMode === 'satz') renderSatzbauer(body);
        else renderBefehl(body);
      }

      function renderSatzbauer(container) {
        const person = BUILDER_PERSONS.find((p) => p.id === ui.personId) || BUILDER_PERSONS[0];
        const form = BUILDER_FORMS.find((f) => f.id === ui.formId) || BUILDER_FORMS[0];
        const verb = BUILDER_VERBS.find((v) => v.id === ui.verbId) || BUILDER_VERBS[0];

        const pronText = form.pron === 'long' ? person.longP : person.shortP;
        const deText = buildGermanSentence(person, form, verb);

        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:18px;">

            <section class="card preview-card" aria-live="polite">
              <div class="preview-pular">
                <span class="p-pron">${esc(pronText)}</span>${form.aux ? ` <span class="p-aux">${esc(form.aux)}</span>` : ''} <span class="p-stem">${esc(verb.stem)}</span><span class="p-end">${esc(form.end)}</span>.
              </div>
              <div class="preview-de">${esc(deText)}</div>
              <div class="preview-breakdown">
                <span class="bd-chip p-pron">${esc(pronText)} (${esc(person.deLabel)})</span>
                ${form.aux ? `<span class="bd-chip p-aux">${esc(form.aux)} (${form.id === 'will' ? 'will' : 'kann'})</span>` : ''}
                <span class="bd-chip p-stem">${esc(verb.stem)}- (${esc(verb.label)})</span>
                <span class="bd-chip p-end">-${esc(form.end)} (${esc(form.note)})</span>
              </div>
            </section>

            <div>
              <div class="section-eyebrow">1. Person</div>
              <div class="chip-grid-3">
                ${BUILDER_PERSONS.map((p) => `
                  <button type="button" class="select-chip ${p.id === person.id ? 'active' : ''}" data-bp="${p.id}">
                    <span class="sc-main">${esc(p.label)}</span>
                    <span class="sc-sub">${esc(p.deLabel)}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="section-eyebrow">2. Modus / Zeit</div>
              <div class="chip-grid">
                ${BUILDER_FORMS.map((f) => `
                  <button type="button" class="select-chip ${f.id === form.id ? 'active' : ''}" data-bf="${f.id}">
                    <span class="sc-main">${esc(f.label)}</span>
                    <span class="sc-sub">${esc(f.sub)}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="section-eyebrow">3. Kernverb (-ugol)</div>
              <div class="chip-grid">
                ${BUILDER_VERBS.map((v) => `
                  <button type="button" class="select-chip ${v.id === verb.id ? 'active' : ''}" data-bv="${v.id}">
                    <span class="sc-main">${esc(v.label)}</span>
                    <span class="sc-sub">${esc(v.inf)}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;

        container.querySelectorAll('[data-bp]').forEach((b) => {
          b.addEventListener('click', () => {
            ui.personId = b.getAttribute('data-bp');
            renderSatzbauer(container);
          });
        });

        container.querySelectorAll('[data-bf]').forEach((b) => {
          b.addEventListener('click', () => {
            ui.formId = b.getAttribute('data-bf');
            renderSatzbauer(container);
          });
        });

        container.querySelectorAll('[data-bv]').forEach((b) => {
          b.addEventListener('click', () => {
            ui.verbId = b.getAttribute('data-bv');
            renderSatzbauer(container);
          });
        });
      }

      function renderBefehl(container) {
        const respect = ui.cmdRespect;

        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:14px;">
            <div class="segmented" role="group" aria-label="Anrede wählen">
              <button type="button" class="seg-btn ${!respect ? 'active' : ''}" data-cmdresp="0">Du (locker)</button>

        container.querySelectorAll('[data-cmdresp]').forEach((b) => {

      /* =======================================================================
         13. TAB 5: GRAMMATIK (9 KAPITEL + MERKSATZ + MINI-CHECK)
         ======================================================================= */
      function renderGrammatik(main) {
        const itemsHtml = GRAMMAR_CHAPTERS.map((ch) => {
          const isOpen = ui.openGramId === ch.id;
          const picked = ui.gramChecks[ch.id];
          const answered = picked !== undefined;

          return `
            <article class="card gram-item ${isOpen ? 'open' : ''}">
              <button type="button" class="gram-head" data-ghead="${ch.id}" aria-expanded="${isOpen}">
                <span class="gram-head-left">
                  <span class="gram-index">${ch.id}</span>
                  <span class="gram-title">${esc(ch.title)}</span>
                </span>
                <svg class="chev" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/>
                </svg>
              </button>

              <div class="gram-content">
                <p class="gram-intro">${esc(ch.intro)}</p>

                <div class="formula-box">${ch.formula}</div>

                <div class="examples-list">
                  ${ch.examples.map(([pu, de]) => `
                    <div><b>${esc(pu)}</b> — ${esc(de)}</div>
                  `).join('')}
                </div>

                <div class="merksatz-box">
                  <span>Merksatz:</span> ${esc(ch.merksatz)}
                </div>

                <div class="mini-check">
                  <div class="mini-check-label">Mini-Check</div>
                  <div class="mini-check-q">${esc(ch.check.q)}</div>
                  <div class="mini-opts">
                    ${ch.check.opts.map((opt, idx) => {
                      let cls = '';
                      if (answered) {
                        if (idx === ch.check.correct) cls = 'ok';
                        else if (idx === picked) cls = 'bad';
                      }
                      return `
                        <button type="button" class="mini-opt ${cls}" data-gcheck="${ch.id}" data-gopt="${idx}">
                          ${esc(opt)}
                        </button>
                      `;
                    }).join('')}
                  </div>
                  ${answered ? `
                    <div class="mini-feedback view-enter">
                      <strong>${picked === ch.check.correct ? 'Richtig.' : 'Lösung:'}</strong> ${esc(ch.check.explain)}
                    </div>
                  ` : ''}
                </div>
              </div>
            </article>
          `;
        }).join('');

        main.innerHTML = `
          <div class="gram-stack view-enter">
            ${itemsHtml}
          </div>
        `;

        main.querySelectorAll('[data-ghead]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = Number(btn.getAttribute('data-ghead'));
            ui.openGramId = ui.openGramId === id ? null : id;
            renderGrammatik(main);
          });
        });

        main.querySelectorAll('[data-gcheck]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const chId = Number(btn.getAttribute('data-gcheck'));
            const optIdx = Number(btn.getAttribute('data-gopt'));
            ui.gramChecks[chId] = optIdx;
            renderGrammatik(main);
          });
        });
      }

      /* =======================================================================
         14. INITIALISIERUNG
         ======================================================================= */
      function init() {
        applyTheme();
        buildDeck(false);
        initQuiz();

        document.querySelectorAll('.nav-btn').forEach((btn) => {
          btn.addEventListener('click', () => setTab(btn.dataset.tab));
        });

        document.getElementById('btn-theme')?.addEventListener('click', () => {
          state.theme = state.theme === 'light' ? 'dark' : 'light';
          saveState();
          applyTheme();
        });

        setTab('uebersetzer');
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
