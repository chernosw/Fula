      const FORMS = [
        { id: 'prog',    label: 'Gerade dabei', pron: 'l', u: 'ude',  a: 'aade',   rule: 'lange Form + -ude',        ruleA: 'lange Form + -aade',        use: 'Läuft genau jetzt.',                                   de: { fin: 'pres', adv: 'gerade' } },
        { id: 'hab',     label: 'Gewohnheit',   pron: 'l', u: 'a',    a: 'oo',     rule: 'lange Form + -a',          ruleA: 'lange Form + -oo',          use: 'Passiert regelmäßig / allgemein – wie das deutsche Präsens.', de: { fin: 'pres', adv: 'gewöhnlich' } },
        { id: 'past',    label: 'Erledigt',     pron: 's', u: 'ii',   a: 'ike',    rule: 'kurze Form + -ii',         ruleA: 'kurze Form + -ike',         use: 'Abgeschlossen: „ich habe … / ich bin …“',              de: { fin: 'aux', adv: '', nonfin: 'part' } },
        { id: 'fut',     label: 'Zukunft',      pron: 's', u: 'ay',   a: 'oto',    rule: 'kurze Form + -ay',         ruleA: 'kurze Form + -oto',         use: 'Wird passieren (kann auch „regelmäßig“ heißen).',      de: { fin: 'werden', adv: '', nonfin: 'inf' } },
        { id: 'negpast', label: 'Nicht getan',  pron: 's', u: 'aali', a: 'aaki',   rule: 'kurze Form + -aali',       ruleA: 'kurze Form + -aaki',        use: 'Ist nicht passiert.',                                  de: { fin: 'aux', adv: 'nicht', nonfin: 'part' } },
        { id: 'negfut',  label: 'Wird nicht',   pron: 's', u: 'ataa', a: 'ataako', rule: 'kurze Form + -ataa',       ruleA: 'kurze Form + -ataako',      use: 'Wird nicht passieren – oder: tut es generell nicht (Mi waawataa = ich kann nicht).', de: { fin: 'werden', adv: 'nicht', nonfin: 'inf' } },
        { id: 'negprog', label: 'Gerade nicht', pron: 's', u: 'ude',  a: 'aade',   rule: 'kurze Form + alaa + -ude', ruleA: 'kurze Form + alaa + -aade', use: 'Läuft gerade nicht.', alaa: true,                       de: { fin: 'pres', adv: 'gerade nicht' } },
        { id: 'imp',     label: 'Befehl',       pron: '',  u: '',     a: '',       rule: '-u (du) · -ee (ihr/höflich) · -en (lasst uns)', ruleA: '-o (du) · -ee (ihr/höflich) · -oɗen (lasst uns)', use: '-ee ist auch die respektvolle Form für Ältere.', de: {} },
      ];

      function getVerb(id) { return VERBS.find((v) => v.id === id) || VERBS[0]; }
      function getForm(id) { return FORMS.find((f) => f.id === id) || FORMS[0]; }
      function ruleFor(form, verb) { return verb.type === 'a' ? form.ruleA : form.rule; }

      function pularSentence(verb, form, pi) {
        const p = PERSONS[pi];
        const end = form[verb.type];
        if (form.alaa) return `${p.s} alaa ${verb.root}${end}.`;
        return `${form.pron === 'l' ? p.l : p.s} ${verb.root}${end}.`;
      }

      function germanSentence(verb, form, pi) {
        const d = verb.de;
        let fin;
        if (form.de.fin === 'pres') fin = d.pres[pi];
        else if (form.de.fin === 'aux') fin = DE_AUX[d.aux][pi];
        else fin = DE_AUX.werden[pi];
        const parts = [PERSONS[pi].de, fin];
        if (d.refl) parts.push(DE_REFL[pi]);
        if (form.de.adv) parts.push(form.de.adv);
        if (form.de.fin === 'pres' && d.tail) parts.push(d.tail);
        if (form.de.nonfin === 'part') parts.push(d.part);
        if (form.de.nonfin === 'inf') parts.push(d.inf);
        return parts.join(' ') + '.';
      }

      function imperatives(verb) {
        const r = verb.root;
        const p = verb.type === 'a' ? [r + 'o!', r + 'ee!', r + 'oɗen!'] : [r + 'u!', r + 'ee!', r + 'en!'];
        return p.map((x) => x.charAt(0).toUpperCase() + x.slice(1));
      }

      // ---------- kleine HTML-Helfer für die Regeln ----------
      function ex(p, d) {
        return `<div class="ex"><span class="ex-p">${p}</span><span class="ex-d">${d}</span></div>`;
      }
      function exList(rows) {
        return `<div class="ex-list">${rows.map((r) => ex(r[0], r[1])).join('')}</div>`;
      }
      function tbl(head, rows, opts) {
        const o = opts || {};
        const t = `<table class="gram-table ${o.compact ? 'compact' : ''}">
          ${head ? `<thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead>` : ''}
          <tbody>${rows.map((r) => `<tr>${r.map((c, i) => `<td class="${(o.cls && o.cls[i]) || ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>`;
        return o.scroll ? `<div class="table-scroll">${t}</div>` : t;
      }

        { q: 'Ich habe keinen Hunger.', a: 'Mi weelaaka.', d: ['Miɗo weelaaka.', 'Mi alaa weelaa.', 'Mi weelaali.'], e: 'Verneinung → immer kurze Form; -egol-Verben verneinen den Zustand mit -aaka.' },
        { q: 'Wohin gehst du?', a: 'Ko honto yahataa?', d: ['Ko honto a yahay?', 'A yahataa honto?', 'Hiɗa yahude honto?'], e: 'W-Frage → Fokusform -ata. Bei „du“ wird das Pronomen zur Endung: yahataa.' },
        { q: 'Du gehst nicht.', a: 'A yahataa.', d: ['Ko yahataa.', 'Hiɗa yahataa.', 'A yahaali.'], e: 'Verneinte Zukunft: kurze Form + -ataa. (A yahaali = du bist nicht gegangen.)' },
        { q: 'Bubakar kann Pular.', a: 'Bubakar no waawi Pular.', d: ['Bubakar waawi Pular.', 'Bubakar miɗo waawi Pular.', 'Bubakar no waawii Pular.'], e: 'Zustand mit einem Nomen als Subjekt braucht das Wörtchen no.' },
        { q: 'Ich muss gehen.', a: 'Ɓee mi yaha.', d: ['Ɓee mi yahude.', 'Miɗo ɓee yaha.', 'Ɓee miɗo yahay.'], e: 'ɓee + kurze Form + einfache Form (-a).' },
        { q: 'Hab keine Angst!', a: 'Wata a hulu!', d: ['A hulataa!', 'Hulu wata!', 'Wata hiɗa hulu!'], e: 'Verbot: wata + kurze Form + -u.' },
        { q: 'Lass uns essen!', a: 'Ñaamen!', d: ['Ñaamee!', 'Ñaamu!', 'En ñaamii!'], e: '„Lasst uns“ = -en (bei -agol: -oɗen).' },
        { q: 'Setz dich!', a: 'Jooɗo!', d: ['Jooɗu!', 'Jooɗaa!', 'Jooɗen!'], e: 'jooɗagol ist ein -agol-Verb → Befehl auf -o.' },
        { q: 'Kommen Sie herein! (höflich)', a: 'Naatee!', d: ['Naatu!', 'Naaten!', 'Naato!'], e: '-ee = Befehl an mehrere oder respektvoll an Ältere.' },
        { q: 'der Mann', a: 'gorko on', d: ['on gorko', 'gorko ɓen', 'gorko ndun'], e: 'Artikel hinter dem Nomen; Mensch (Einzahl) → on.' },
        { q: 'die Männer', a: 'worɓe ɓen', d: ['gorko ɓen', 'gorkoɓe ɓen', 'worɓe on'], e: 'Mehrzahl ist unregelmäßig (g → w); Menschen (Mehrzahl) → ɓen.' },
        { q: 'dieses Buch', a: 'ndee deftere', d: ['deftere nden', 'deftere ndee', 'oo deftere'], e: 'Demonstrativ steht VOR dem Nomen: nden → ndee. (deftere nden = das Buch)' },
        { q: 'das Wasser', a: 'ndiyan ɗan', d: ['ndiyan on', 'ndiyan nden', 'ndiyan ngal'], e: 'Flüssigkeiten haben die Klasse ɗan.' },
        { q: 'drei Kinder', a: 'ɓiɓɓe tato', d: ['ɓiɓɓe tati', 'tato ɓiɓɓe', 'ɓiɗɗo tato'], e: 'Zahl hinter dem Nomen; bei Menschen die Personenform: tato statt tati.' },
        { q: 'Ich war froh.', a: 'Hari miɗo weltii.', d: ['Miɗo weltii.', 'Mi weltaaki.', 'Miɗo weltude.'], e: 'hari vor dem Satz verlegt ihn in die Vergangenheit.' },
        { q: 'Er ist wahrscheinlich dort.', a: 'Haray himo ton.', d: ['Hari himo ton.', 'Himo ton.', 'O alaa ton.'], e: 'haray = wahrscheinlich; hari = war.' },
        { q: 'Wer hat dir das gegeben? – Ko hombo jonni ___ ɗun?', a: 'ma', d: ['maa', 'a', 'an'], e: 'Objekt „dich/dir“ = ma. (maa = dein, a = du)' },
        { q: 'Ich habe kein Geld.', a: 'Mi alaa kaalisi.', d: ['Miɗo alaa kaalisi.', 'Miɗo maraa kaalisi.', 'Wonaa mi kaalisi.'], e: 'Besitz verneint: kurze Form + alaa (oder: Mi maraa).' },
        { q: 'Ein Taxi ist teurer als der Bus.', a: 'Taksi no ɓuri kaar sattude.', d: ['Kaar no ɓuri taksi sattude.', 'Taksi no satti kaar.', 'Taksi ɓuri no kaar sattude.'], e: 'Vergleich: X no ɓuri Y + Eigenschaft auf -ude.' },
        { q: 'Wer hat gekocht?', a: 'Ko hombo defi?', d: ['Ko hombo defii?', 'Hombo defude?', 'Ko hombo defay?'], e: 'Frage nach Erledigtem → Fokusform -i (nicht -ii).' },
        { q: 'Was willst du?', a: 'Ko honɗun faalaɗaa?', d: ['Ko honɗun a faalaa?', 'Hiɗa faalaa honɗun?', 'Ko honɗun faalaaka?'], e: 'Fokusform mit Umstellung: „du“ wird zur Endung -ɗaa.' },
        { q: 'Ich gehe gerade nicht.', a: 'Mi alaa yahude.', d: ['Miɗo alaa yahude.', 'Miɗo yahaali.', 'Mi yahudaa.'], e: 'Verlauf verneint: kurze Form + alaa + -ude.' },
      ];

      function makeVerbQuestion() {
        const verb = pick(VERBS);
        const pi = Math.floor(Math.random() * PERSONS.length);
        const pool = FORMS.filter((f) => f.id !== 'imp');
        const target = pick(pool);
        const others = shuffle(pool.filter((f) => f.id !== target.id)).slice(0, 3);
        const reverse = Math.random() < 0.35;
        const options = shuffle([target, ...others]).map((f) => ({
          text: reverse ? germanSentence(verb, f, pi) : pularSentence(verb, f, pi),
          ok: f.id === target.id,
        }));
        return {
          label: reverse ? 'Was bedeutet das?' : 'Wie sagt man das auf Pular?',
          prompt: reverse ? pularSentence(verb, target, pi) : germanSentence(verb, target, pi),
          options,
          explain: `${target.label}: ${ruleFor(target, verb)}. (${verb.inf} = ${verb.deInf})`,
          answer: `${pularSentence(verb, target, pi)} = ${germanSentence(verb, target, pi)}`,
        };
      }

      function makeStaticQuestion(item) {
        return {
          label: item.q.includes('___') ? 'Lücke füllen' : 'Wie sagt man das auf Pular?',
          prompt: item.q,
          options: shuffle([{ text: item.a, ok: true }, ...item.d.map((t) => ({ text: t, ok: false }))]),
          explain: item.e,
          answer: item.a,
        };
      }

      function newDrillRound() {
        const verbQs = Array.from({ length: 5 }, makeVerbQuestion);
        const staticQs = shuffle(GRAM_DRILLS).slice(0, 5).map(makeStaticQuestion);
        ui.drill = { items: shuffle([...verbQs, ...staticQs]), idx: 0, chosen: null, correct: 0, done: false };
      }

      // ---------- Rendering ----------
      function renderGrammatik(main) {
        main.innerHTML = `
          <div class="view-enter" style="display:flex; flex-direction:column; gap:15px;">
            <div class="segmented" role="tablist" style="grid-template-columns:repeat(3, 1fr);">
              <button type="button" class="seg-btn ${ui.gramSub === 'regeln' ? 'active' : ''}" data-gs="regeln">Regeln</button>
              <button type="button" class="seg-btn ${ui.gramSub === 'werkstatt' ? 'active' : ''}" data-gs="werkstatt">Verb-Werkstatt</button>
              <button type="button" class="seg-btn ${ui.gramSub === 'ueben' ? 'active' : ''}" data-gs="ueben">Üben</button>
            </div>
            <div id="gram-body-wrap"></div>
          </div>
        `;

        main.querySelectorAll('[data-gs]').forEach((btn) => {
          btn.addEventListener('click', () => {
            ui.gramSub = btn.getAttribute('data-gs');
            renderGrammatik(main);
          });
        });

        const wrap = document.getElementById('gram-body-wrap');
        if (ui.gramSub === 'regeln') renderGramRegeln(wrap);
        else if (ui.gramSub === 'werkstatt') renderWerkstatt(wrap);
        else renderGramUeben(wrap);
      }

      function renderGramRegeln(container) {
        const groups = gramGroups();
        let n = 0;
        container.innerHTML = `
          <div class="gram-list">
            ${groups.map((g) => `
              <div class="gram-group-title">${esc(g.title)}</div>
              <div class="gram-group-sub">${esc(g.sub)}</div>
              ${g.items.map((r) => {
                n++;
                const open = ui.openGramId === r.id;
                return `
                  <article class="card gram-card ${open ? 'open' : ''}" id="gram-${r.id}">
                    <button type="button" class="gram-head" data-gid="${r.id}" aria-expanded="${open}">
                      <span class="gram-head-left">
                        <span class="gram-num">${n}</span>
                        <span class="gram-head-text">
                          <span class="gram-title">${esc(r.title)}</span>
                          <span class="gram-teaser">${esc(r.teaser)}</span>
                        </span>
                      </span>
                      <svg class="chev" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/>
                      </svg>
                    </button>
                    <div class="gram-body">${open ? r.html() : ''}</div>
                  </article>
                `;
              }).join('')}
            `).join('')}
          </div>
        `;

        container.querySelectorAll('[data-gid]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-gid');
            ui.openGramId = ui.openGramId === id ? null : id;
            renderGramRegeln(container);
            if (ui.openGramId) {
              const el = document.getElementById('gram-' + id);
              if (el) {
                const top = el.getBoundingClientRect().top + window.scrollY - 70;
                if (el.getBoundingClientRect().top < 60) window.scrollTo({ top, behavior: 'smooth' });
              }
            }
          });
        });

        container.querySelectorAll('[data-gp]').forEach((btn) => {
          btn.addEventListener('click', () => {
            ui.gPerson = Number(btn.getAttribute('data-gp'));
            renderGramRegeln(container);
          });
        });

        container.querySelectorAll('[data-goto-ws]').forEach((btn) => {
          btn.addEventListener('click', () => {
            ui.gramSub = 'werkstatt';
            renderGrammatik(document.getElementById('main-content'));
            window.scrollTo({ top: 0, behavior: 'instant' });
          });
        });
      }

      function renderWerkstatt(container) {
        const verb = getVerb(ui.wsVerb);
        const form = getForm(ui.wsForm);
        const isImp = form.id === 'imp';

        let rows = '';
        if (isImp) {
          const imps = imperatives(verb);
          const who = ['du', 'ihr / Sie (höflich)', 'lasst uns'];
          rows = imps.map((p, i) => `
            <div class="conj-row">
              <span class="conj-p">${esc(p)}</span>
              <span class="conj-d">${esc(verb.de.imp[i])}<br><span style="font-size:11.5px; color:var(--text-tertiary);">${who[i]}</span></span>
            </div>
          `).join('');
        } else {
          rows = PERSONS.map((p, i) => `
            <div class="conj-row">
              <span class="conj-p">${esc(pularSentence(verb, form, i))}</span>
              <span class="conj-d">${esc(germanSentence(verb, form, i))}${p.tag ? `<br><span style="font-size:11.5px; color:var(--text-tertiary);">${esc(p.tag)}</span>` : ''}</span>
            </div>
          `).join('');
        }

        const chipVerb = (v) => `
          <button type="button" class="slot-chip ${v.id === verb.id ? 'active' : ''}" data-wv="${v.id}">
            <span>${esc(v.inf)}</span><span class="sub">${esc(v.deInf)}</span>
          </button>`;

        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:16px;">
            <section class="card ws-out" aria-live="polite">
              <div class="ws-head">
                <span class="ws-title">${esc(verb.inf)} · ${esc(form.label)}</span>
                <span class="ws-rule">${esc(ruleFor(form, verb))}</span>
                <span class="ws-use">${esc(form.use)}</span>
              </div>
              ${rows}
            </section>

            <div>
              <div class="section-eyebrow">Form</div>
              <div class="slot-grid">
                ${FORMS.map((f) => `<button type="button" class="slot-chip ${f.id === form.id ? 'active' : ''}" data-wf="${f.id}">${esc(f.label)}</button>`).join('')}
              </div>
            </div>

            <div>
              <div class="section-eyebrow">Verb · -ugol (aktiv)</div>
              <div class="slot-grid">${VERBS.filter((v) => v.type === 'u').map(chipVerb).join('')}</div>
            </div>

            <div>
              <div class="section-eyebrow">Verb · -agol (auf sich selbst)</div>
              <div class="slot-grid">${VERBS.filter((v) => v.type === 'a').map(chipVerb).join('')}</div>
            </div>

            <div class="tip-box"><b>So liest du das:</b> Die Person steckt nur im Pronomen – das Verb bleibt für alle gleich. Lange Pronomen (Miɗo …) nur bei „gerade“ und „Gewohnheit“, sonst immer kurz (mi …). <i>-egol</i>-Verben wie <i>weelegol</i> sind meist Zustände → siehe Regeln › Zustandsverben.</div>

            <button id="btn-ws-drill" type="button" class="btn-secondary">Jetzt üben →</button>
          </div>
        `;

        container.querySelectorAll('[data-wv]').forEach((b) => {
          b.addEventListener('click', () => { ui.wsVerb = b.getAttribute('data-wv'); renderWerkstatt(container); });
        });
        container.querySelectorAll('[data-wf]').forEach((b) => {
          b.addEventListener('click', () => { ui.wsForm = b.getAttribute('data-wf'); renderWerkstatt(container); });
        });
        document.getElementById('btn-ws-drill')?.addEventListener('click', () => {
          ui.gramSub = 'ueben';
          newDrillRound();
          renderGrammatik(document.getElementById('main-content'));
          window.scrollTo({ top: 0, behavior: 'instant' });
        });
      }

      function renderGramUeben(container) {
        if (!ui.drill) newDrillRound();
        const dr = ui.drill;
        const total = dr.items.length;

        if (dr.done) {
          const pct = Math.round((dr.correct / total) * 100);
          container.innerHTML = `
            <section class="card empty-card view-enter">
              <div style="font-size:36px; font-weight:700; color:var(--accent); line-height:1.1;">${pct} %</div>
              <h3>${pct >= 85 ? 'Hiɗa waawi!' : pct >= 60 ? 'No moƴƴi!' : 'Seeɗa seeɗa …'}</h3>
              <p>${dr.correct} von ${total} richtig. Jede Runde mischt neue Verben, Personen und Regeln.</p>
              <div class="empty-actions">
                <button id="btn-drill-again" type="button" class="btn-primary">Neue Runde</button>
                <button id="btn-drill-rules" type="button" class="btn-secondary">Regeln nachlesen</button>
              </div>
            </section>
          `;
          document.getElementById('btn-drill-again')?.addEventListener('click', () => { newDrillRound(); renderGramUeben(container); });
          document.getElementById('btn-drill-rules')?.addEventListener('click', () => {
            ui.gramSub = 'regeln';
            renderGrammatik(document.getElementById('main-content'));
          });
          return;
        }

        const it = dr.items[dr.idx];
        const answered = dr.chosen !== null;
        const pct = Math.round(((dr.idx + (answered ? 1 : 0)) / total) * 100);

        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:13px;">
            <div>
              <div class="train-meta-row" style="margin-bottom:6px;">
                <span>Aufgabe ${dr.idx + 1} / ${total}</span>
                <span>${dr.correct} richtig</span>
              </div>
              <div class="progress-slim"><div class="progress-slim-fill" style="width:${pct}%;"></div></div>
            </div>
            <section class="card quiz-card view-enter">
              <div>
                <div class="quiz-prompt-label">${esc(it.label)}</div>
                <div class="quiz-prompt" style="margin-top:4px;">${esc(it.prompt)}</div>
              </div>
              <div class="quiz-opts">
                ${it.options.map((o, i) => {
                  let cls = '';
                  if (answered) cls = o.ok ? 'correct' : (i === dr.chosen ? 'wrong' : 'dim');
                  return `<button type="button" class="quiz-opt ${cls}" data-dopt="${i}" ${answered ? 'disabled' : ''}>${esc(o.text)}</button>`;
                }).join('')}
              </div>
              ${answered ? `
                <div class="quiz-explain view-enter">
                  <strong>${it.options[dr.chosen].ok ? 'Richtig!' : 'Richtig wäre:'}</strong> ${esc(it.answer)}<br>${esc(it.explain)}
                </div>
                <button id="btn-drill-next" type="button" class="btn-primary">${dr.idx + 1 < total ? 'Weiter' : 'Ergebnis ansehen'}</button>
              ` : ''}
            </section>
          </div>
        `;

        container.querySelectorAll('[data-dopt]').forEach((b) => {
          b.addEventListener('click', () => {
            if (dr.chosen !== null) return;
            dr.chosen = Number(b.getAttribute('data-dopt'));
            if (it.options[dr.chosen].ok) dr.correct++;
            touchStreak();
            renderGramUeben(container);
          });
        });

        document.getElementById('btn-drill-next')?.addEventListener('click', () => {
          if (dr.idx + 1 < total) { dr.idx++; dr.chosen = null; }
          else dr.done = true;
          renderGramUeben(container);
        });
      }

      /* =======================================================================
         10. BOOTSTRAP
         ======================================================================= */
      function init() {
        applyAppearance();
        updateOfflineBadge();
        buildLearnDeck('due');
        initQuiz();

        window.addEventListener('online', updateOfflineBadge);
        window.addEventListener('offline', updateOfflineBadge);

        document.querySelectorAll('.nav-btn').forEach((btn) => {
          btn.addEventListener('click', () => setTab(btn.dataset.tab));
        });

        document.getElementById('btn-open-settings')?.addEventListener('click', openSettings);
        document.getElementById('btn-close-settings')?.addEventListener('click', closeSettings);
        document.getElementById('settings-backdrop')?.addEventListener('click', (e) => {
          if (e.target.id === 'settings-backdrop') closeSettings();
        });

        document.getElementById('btn-edit-cancel')?.addEventListener('click', closeEdit);
        document.getElementById('btn-edit-save')?.addEventListener('click', saveEdit);
        document.getElementById('edit-backdrop')?.addEventListener('click', (e) => {
          if (e.target.id === 'edit-backdrop') closeEdit();
        });

        document.getElementById('btn-confirm-cancel')?.addEventListener('click', closeConfirm);
        document.getElementById('confirm-backdrop')?.addEventListener('click', (e) => {
          if (e.target.id === 'confirm-backdrop') closeConfirm();
        });
        document.getElementById('btn-confirm-ok')?.addEventListener('click', () => {
          const cb = ui.confirmCallback;
          closeConfirm();
          if (typeof cb === 'function') cb();
        });

        setTab('lernen');
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>
